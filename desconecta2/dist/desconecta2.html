    if (!p) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
    document.body.style.overflow = 'hidden';
    const pol = D2.state.policy;
    let html = '';
    if (p.phase === 'alarm') {
      const left = pol.maxPostpones - D2.state.worker.postponesUsed;
      html = '<div class="alarm"><div class="alarm-inner">' +
        '<div class="alarm-bell">' + D2.icon('bell') + '</div>' +
        '<div class="eyebrow">' + p.slot + ' · Pausa activa</div>' +
        '<h1>Es hora de tu pausa activa</h1>' +
        '<p class="muted">' + pol.dur + ' minutos de respiración y movilidad. Al comenzar se activa No molestar y tus apps de trabajo quedan en pausa hasta que termines.</p>' +
        '<div class="actions"><button class="btn btn-primary" data-act="pause-start">' + D2.icon('play') + 'Comenzar pausa</button>' +
        '<button class="btn btn-ghost" data-act="pause-snooze"' + (left > 0 ? '' : ' disabled') + '>' + D2.icon('snooze') + 'Posponer ' + pol.postponeMin + ' min</button>' +
        (pol.allowSkip ? '<button class="btn btn-ghost" data-act="pause-skip">' + D2.icon('skip') + 'Saltar</button>' : '') + '</div>' +
        '<p class="small muted">' + (left > 0 ? 'Puedes posponer ' + left + (left === 1 ? ' vez más' : ' veces más') + ' hoy.' : 'Ya usaste tus aplazamientos de hoy.') + '</p>' +
        '</div></div>';
    } else if (p.phase === 'skip') {
      html = '<div class="alarm"><div class="alarm-inner">' +
        '<h1>¿Por qué saltas esta pausa?</h1>' +
        '<p class="muted">Tu empresa ve los motivos para ajustar horarios y cargas de trabajo.</p>' +
        '<div class="reason-chips">' + ['Estaba en reunión', 'Atención a cliente', 'Mucha carga de trabajo', 'Otro motivo'].map((r) => '<button data-act="pause-skip-reason" data-reason="' + r + '">' + r + '</button>').join('') + '</div>' +
        '<button class="btn btn-ghost" data-act="pause-back">' + D2.icon('back') + 'Volver</button>' +
        '</div></div>';
    } else if (p.phase === 'run') {
      const s = p.steps[p.step];
      const stage = s.type === 'breath'
        ? '<div class="breath"><div class="ring"></div><div class="ball" id="pl-ball"></div><div class="word" id="pl-word">Inhala</div></div>'
        : figure(s.anim);
      html = '<div class="overlay-inner">' +
        '<div class="ov-top"><div><div class="eyebrow">Pausa activa · ' + p.slot + '</div><h2>' + s.title + '</h2></div>' + statusChips() + '</div>' +
        '<div class="ov-grid">' +
        '<div class="stack">' +
        '<div class="player' + (p.playing ? '' : ' paused') + '" id="player">' +
        '<div class="player-stage">' + stage + '</div>' +
        '<div class="player-top"><div class="t"><b>' + s.title + '</b><span>Paso ' + (p.step + 1) + ' de ' + p.steps.length + '</span></div><span class="player-badge">Video guiado</span></div>' +
        '<div class="player-bottom"><div class="player-progress"><i id="pl-progress"></i></div>' +
        '<div class="player-ctrl"><button data-act="pause-toggle" aria-label="' + (p.playing ? 'Pausar video' : 'Reproducir video') + '">' + D2.icon(p.playing ? 'pauseFill' : 'play') + '</button>' +
        '<button data-act="pause-next" aria-label="Siguiente ejercicio">' + D2.icon('next') + '</button>' +
        '<span id="pl-time">0:00 / ' + D2.mmss(s.dur) + '</span><span class="grow"></span>' +
        '<button class="speed" data-act="pause-speed" title="Velocidad de la demo">x' + p.speed + '</button></div></div>' +
        '</div>' +
        '<p class="muted">' + s.desc + '</p>' +
        '</div>' +
        '<div class="stack">' +
        '<div class="ov-panel"><div class="eyebrow">Tiempo restante</div><div class="big-clock" id="pl-total">' + D2.mmss(totalLeft(p)) + '</div>' +
        '<div class="steps-list">' + p.steps.map((st, i) => '<div class="sl ' + (i < p.step ? 'done' : i === p.step ? 'current' : '') + '"><span class="n">' + (i < p.step ? '✓' : i + 1) + '</span>' + st.title + '<span class="d">' + D2.mmss(st.dur) + '</span></div>').join('') + '</div></div>' +
        '<div class="ov-panel"><h4>En pausa mientras descansas</h4>' + blockedList() + '<p class="small muted">Las llamadas de emergencia siguen funcionando.</p></div>' +
        '<button class="btn btn-ghost" data-act="pause-finish">Terminar antes</button>' +
        '</div></div></div>';
    } else if (p.phase === 'done') {
      const next = D2.nextSlot();
      html = '<div class="alarm"><div class="alarm-inner">' +
        '<div class="alarm-bell">' + D2.icon('check') + '</div>' +
        '<h1>Pausa completada</h1>' +
        '<p class="muted">Tus apps de trabajo se reactivaron.' + (next ? ' Tu próxima pausa es a las ' + next.label + '.' : ' No te quedan pausas hoy.') + '</p>' +
        '<h3>¿Cómo te sientes ahora?</h3>' +
        '<div class="mood">' + ['Mal', 'Regular', 'Igual', 'Bien', 'Muy bien'].map((m, i) => '<button data-act="pause-mood" data-mood="' + (i + 1) + '">' + D2.face(i + 1) + m + '</button>').join('') + '</div>' +
        '<button class="link" style="color:var(--pause-muted)" data-act="pause-mood" data-mood="0">Prefiero no responder</button>' +
        '</div></div>';
    } else if (p.phase === 'offhours') {
      html = '<div class="offhours"><div class="alarm-inner">' +
        '<div class="moon"></div>' +
        '<div class="eyebrow">' + pol.end + ' · Fin de tu jornada</div>' +
        '<h1>Ya estás desconectada</h1>' +
        '<p class="muted">Hasta mañana a las ' + pol.start + ', estas apps quedan en pausa en tus dispositivos de trabajo. Los mensajes que lleguen te van a esperar mañana.</p>' +
        blockedList() +
        '<div class="ov-panel" style="text-align:left;width:100%"><div class="row nowrap">' + D2.icon('shield') + '<span class="small">Derecho a desconexión: tu empresa se compromete a no pedirte respuestas fuera de tu jornada. Si hay una emergencia real, te van a llamar por teléfono.</span></div></div>' +
        '<button class="btn btn-primary" data-act="pause-close">Volver a la demo</button>' +
        '</div></div>';
    }
    root.innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-label="Pausa activa">' + html + '</div>';
    D2.pauseTick(true);
  };

  D2.openAlarm = function (slot) { D2.pause = { phase: 'alarm', slot }; D2.renderOverlay(); };
  D2.closeOverlay = function () { D2.pause = null; D2.renderOverlay(); };

  D2.pauseTick = function (domOnly) {
    const p = D2.pause;
    const st = D2.state;
    if (!p) {
      if (st.role !== 'worker') return;
      const next = D2.nextSlot();
      if (next && D2.now() >= D2.slotTarget(next)) D2.openAlarm(next.label);
      return;
    }
    if (p.phase !== 'run') return;
    if (!domOnly && p.playing) {
      p.elapsed += 0.25 * p.speed;
      if (p.elapsed >= p.steps[p.step].dur) {
        if (p.step < p.steps.length - 1) { p.step++; p.elapsed = 0; D2.renderOverlay(); return; }
        finish(); return;
      }
    }
    const s = p.steps[p.step];
    const prog = document.getElementById('pl-progress');
    if (prog) prog.style.width = Math.min(100, (p.elapsed / s.dur) * 100) + '%';
    const t = document.getElementById('pl-time');
    if (t) t.textContent = D2.mmss(p.elapsed) + ' / ' + D2.mmss(s.dur);
    const tot = document.getElementById('pl-total');
    if (tot) tot.textContent = D2.mmss(totalLeft(p));
    const ball = document.getElementById('pl-ball');
    const word = document.getElementById('pl-word');
    if (ball && word) {
      const c = p.elapsed % 12; // 4 inhala · 2 sostén · 6 exhala
      let scale, label, left;
      if (c < 4) { scale = 0.45 + (c / 4) * 0.55; label = 'Inhala'; left = 4 - c; }
      else if (c < 6) { scale = 1; label = 'Sostén'; left = 6 - c; }
      else { scale = 1 - ((c - 6) / 6) * 0.55; label = 'Exhala'; left = 12 - c; }
      ball.style.transform = 'scale(' + scale.toFixed(3) + ')';
      word.innerHTML = label + '<small>' + Math.ceil(left) + '</small>';
    }
  };

  function finish() {
    const p = D2.pause;
    const w = D2.state.worker;
    w.slotStatus[p.slot] = 'completada';
    delete w.snooze[p.slot];
    D2.save();
    D2.pause = { phase: 'done', slot: p.slot };
    D2.renderOverlay();
    D2.render();
  }

  Object.assign(D2.actions, {
    'pause-test'() {
      const next = D2.nextSlot();
      if (!next) { D2.toast('No quedan pausas programadas hoy', 'clock'); return; }
      D2.advanceClockTo(D2.slotTarget(next) - 1500);
      D2.tickDom();
    },
    'pause-now'() {
      const next = D2.nextSlot();
      const slot = next ? next.label : D2.hhmm(D2.now());
      D2.pause = { phase: 'run', slot, step: 0, elapsed: 0, playing: true, speed: 1, steps: D2.routineSteps() };
      D2.renderOverlay();
    },
    'pause-start'() {
      const p = D2.pause;
      D2.pause = { phase: 'run', slot: p.slot, step: 0, elapsed: 0, playing: true, speed: 1, steps: D2.routineSteps() };
      D2.renderOverlay();
    },
    'pause-snooze'() {
      const pol = D2.state.policy;
      const w = D2.state.worker;
      if (w.postponesUsed >= pol.maxPostpones) return;
      w.postponesUsed++;
      w.snooze[D2.pause.slot] = D2.now() + pol.postponeMin * 60000;
      D2.save();
      D2.closeOverlay();
      D2.render();
      D2.toast('Pausa pospuesta ' + pol.postponeMin + ' minutos', 'snooze');
    },
    'pause-skip'() { D2.pause.phase = 'skip'; D2.renderOverlay(); },
    'pause-back'() { D2.pause.phase = 'alarm'; D2.renderOverlay(); },
    'pause-skip-reason'(el) {
      const w = D2.state.worker;
      w.slotStatus[D2.pause.slot] = 'saltada';
      w.skipReasons.push({ slot: D2.pause.slot, reason: el.dataset.reason });
      D2.save();
      D2.closeOverlay();
      D2.render();
      D2.toast('Pausa saltada. Motivo registrado.', 'skip');
    },
    'pause-toggle'() { D2.pause.playing = !D2.pause.playing; D2.renderOverlay(); },
    'pause-next'() {
      const p = D2.pause;
      if (p.step < p.steps.length - 1) { p.step++; p.elapsed = 0; D2.renderOverlay(); } else finish();
    },
    'pause-speed'() {
      const p = D2.pause;
      p.speed = SPEEDS[(SPEEDS.indexOf(p.speed) + 1) % SPEEDS.length];
      D2.renderOverlay();
    },
    'pause-finish'() { finish(); },
    'pause-mood'(el) {
      const m = Number(el.dataset.mood);
      if (m) D2.state.worker.moods.push({ slot: D2.pause.slot, mood: m });
      D2.save();
      D2.closeOverlay();
      D2.render();
      D2.toast(m ? 'Gracias. Pausa registrada.' : 'Pausa registrada.', 'leaf');
    },
    'offhours'() { D2.pause = { phase: 'offhours' }; D2.renderOverlay(); },
    'pause-close'() { D2.closeOverlay(); },
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && D2.pause && (D2.pause.phase === 'offhours' || D2.pause.phase === 'done')) D2.closeOverlay();
  });
})();
</script>
<script>
/* Desconecta2 · vista Trabajador (app del colaborador). */
(function () {
  const D2 = window.D2;
  const V = D2.views.worker;
  const esc = D2.esc;
  const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* ---------- Piezas compartidas con RR.HH. ---------- */
  D2.stepper = function (status) {
    return '<div class="stepper" aria-label="Estado: ' + D2.STATUSES[status] + '">' + D2.STATUSES.map((s, i) =>
      '<div class="st ' + (i < status ? 'done' : i === status ? (status === 3 ? 'done current' : 'current') : '') + '"><i></i>' + s + '</div>').join('') + '</div>';
  };
  D2.chatHtml = function (c, perspective) {
    return '<div class="chat" id="chat">' + c.messages.map((m) => {
      if (m.from === 'system') return '<div class="msg system">' + esc(m.text) + ' · ' + D2.fmtDateTime(m.at) + '</div>';
      const mine = perspective === 'worker' ? m.from === 'me' : m.from === 'rrhh';
      const who = m.from === 'me' ? (perspective === 'worker' ? 'Tú' : 'Denunciante (anónimo)') : 'Equipo de Personas';
      return '<div class="msg ' + (mine ? 'me' : 'them') + '"><span class="meta">' + who + ' · ' + D2.fmtDateTime(m.at) + '</span>' + esc(m.text) + '</div>';
    }).join('') + '</div>';
  };
  D2.deadlineInfo = function (c) {
    const days = D2.daysSince(c.received);
    const left = D2.DEADLINE_DAYS - days;
    return { days, left };
  };
  function scrollChat() { const ch = document.getElementById('chat'); if (ch) ch.scrollTop = ch.scrollHeight; }
  D2.scrollChat = scrollChat;

  /* ---------- Inicio ---------- */
  V.inicio = function () {
    const st = D2.state, w = st.worker, pol = st.policy;
    const today = new Date(D2.now());
    const slots = D2.slots();
    const next = D2.nextSlot();
    const done = slots.filter((s) => s.status === 'completada').length;
    const routineName = { mixta: 'Rutina mixta', respiracion: 'Solo respiración', movilidad: 'Solo movilidad' }[w.prefs.routine];
    const slotHtml = slots.map((s) => {
      const cls = s.status || (next && s.label === next.label ? 'proxima' : '');
      const lbl = { completada: 'Completada', saltada: 'Saltada' }[s.status] || (cls === 'proxima' ? (s.snooze ? 'Pospuesta' : 'Próxima') : 'Pendiente');
      return '<div class="slot ' + cls + '" data-tip="<b>' + s.label + '</b>' + lbl + '"><i></i>' + s.label + '</div>';
    }).join('');
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">' + DAYS[today.getDay()] + ' ' + today.getDate() + ' de ' + MONTHS[today.getMonth()] + ' · <span data-clock class="num"></span></span>' +
      '<h1>Hola, Camila</h1><p>Estás en tu jornada. La desconexión automática empieza a las ' + pol.end + '.</p></div></div>' +
      '<div class="grid g-main">' +
      '<div class="stack">' +
      '<section class="card next-pause"><div class="rings"></div>' +
      (next
        ? '<div class="eyebrow">Próxima pausa activa · ' + (next.snooze ? D2.hhmm(next.snooze) + ' (pospuesta)' : next.label) + '</div>' +
          '<div class="count" data-countdown aria-live="off"></div>' +
          '<div class="sub">' + routineName + ' · ' + pol.dur + ' min · No molestar y apps en pausa mientras dura</div>'
        : '<div class="eyebrow">Pausas de hoy</div><div class="count">Listo</div><div class="sub">No te quedan pausas programadas hoy.</div>') +
      '<div class="row">' +
      '<button class="btn btn-primary" data-act="pause-now" style="background:var(--pause-glow);color:#06180E">' + D2.icon('play') + 'Hacer mi pausa ahora</button>' +
      (next ? '<button class="btn btn-ghost" data-act="pause-test">' + D2.icon('bell') + 'Probar la alarma</button>' : '') +
      '</div></section>' +
      '<section class="card"><div class="card-head"><div><h3>Tus pausas de hoy</h3><p>' + done + ' de ' + slots.length + ' completadas · cada ' + D2.effectiveFreq() + ' minutos</p></div>' +
      '<button class="btn btn-quiet btn-sm" data-act="go" data-view="pausas">Ajustar</button></div>' +
      '<div class="timeline">' + slotHtml + '</div>' +
      '<div class="legend"><span><i style="background:var(--ok)"></i>Completada</span><span><i style="background:var(--accent)"></i>Próxima</span><span><i style="background:var(--crit)"></i>Saltada</span><span><i style="background:var(--surface-3)"></i>Pendiente</span></div>' +
      '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Desconexión</h3><p>Tu jornada: ' + pol.start + ' a ' + pol.end + '</p></div><span class="pill pill-ok">En jornada</span></div>' +
      D2.DEVICES.map((d) => '<div class="device">' + D2.icon(d.kind) + '<div class="grow"><b>' + d.name + '</b><span>' + d.model + '</span></div><span class="pill pill-neutral nodot">Conectado</span></div>').join('') +
      '<div class="row"><button class="btn btn-quiet btn-sm" data-act="offhours">' + D2.icon('moon') + 'Ver cómo se ve a las ' + pol.end + '</button></div>' +
      '</section>' +
      '</div>' +
      '<div class="stack">' +
      (w.survey
        ? '<section class="card"><div class="row nowrap"><span class="icon-dot ok">' + D2.icon('check') + '</span><div><h4>Encuesta de septiembre respondida</h4><p class="small muted">Gracias. Los resultados se comparten con tu equipo en noviembre.</p></div></div></section>'
        : '<section class="card"><div class="row nowrap"><span class="icon-dot brand">' + D2.icon('survey') + '</span><div><span class="eyebrow">Pendiente · cierra el 7 de octubre</span><h4>Encuesta de clima de septiembre</h4></div></div>' +
          '<p class="small ink2">6 preguntas, 2 minutos. Es anónima: tu jefatura solo ve promedios de equipos con 5 o más respuestas.</p>' +
          '<button class="btn btn-primary" data-act="go" data-view="encuesta">Responder ahora</button></section>') +
      '<section class="card"><div class="row nowrap"><span class="icon-dot brand">' + D2.icon('shield') + '</span><div><span class="eyebrow">100% anónimo</span><h4>Canal de denuncias</h4></div></div>' +
      '<p class="small ink2">Si algo no está bien en tu trabajo, cuéntalo. Llega directo a RR.HH. y nadie sabrá que fuiste tú.</p>' +
      '<div class="row"><button class="btn btn-ghost" data-act="go" data-view="denuncias" data-tab="nueva">Hacer una denuncia</button><button class="link small" data-act="go" data-view="denuncias" data-tab="seguir">Seguir mi denuncia</button></div></section>' +
      '<section class="card flat"><h4>Cómo te has sentido después de tus pausas</h4>' + moodSummary() + '</section>' +
      '</div></div></div>';
  };
  function moodSummary() {
    const moods = D2.state.worker.moods;
    const base = [4, 4, 3, 5, 4, 4, 3];
    const all = base.concat(moods.map((m) => m.mood));
    const a = D2.avg(all);
    return '<div class="row nowrap"><span style="width:44px;height:44px;color:var(--brand)">' + D2.face(Math.round(a)) + '</span><div><b class="num">' + D2.f1(a) + ' de 5</b><p class="small muted">Promedio de tus últimas ' + all.length + ' pausas. Solo tú ves este dato.</p></div></div>';
  }

  /* ---------- Mis pausas ---------- */
  V.pausas = function () {
    const st = D2.state, w = st.worker, pol = st.policy;
    const slots = D2.slots();
    const doneToday = slots.filter((s) => s.status === 'completada').length;
    const week = w.week.concat([{ d: 'Hoy', v: doneToday, today: true }]);
    const freq = D2.effectiveFreq();
    const chip = (name, val, label, cur) => '<label class="chip-radio"><input type="radio" name="' + name + '" value="' + val + '"' + (String(cur) === String(val) ? ' checked' : '') + '><span>' + label + '</span></label>';
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Pausas activas</span><h1>Mis pausas</h1><p>Tu empresa define los límites. Dentro de ellos, tú ajustas tus pausas.</p></div></div>' +
      '<div class="grid g2">' +
      '<section class="card"><div class="card-head"><div><h3>Mis preferencias</h3><p>Los cambios se aplican desde la próxima pausa.</p></div></div>' +
      '<form data-form="prefs" class="stack">' +
      '<div class="range-row"><div class="row"><label class="small" for="pref-freq"><b>Frecuencia</b></label><span class="num small" id="freq-out">Cada ' + freq + ' min</span></div>' +
      '<input id="pref-freq" name="freq" type="range" min="' + pol.freqMin + '" max="' + pol.freqMax + '" step="15" value="' + freq + '" data-input="freq-out">' +
      '<div class="row xs muted" style="justify-content:space-between"><span>' + pol.freqMin + ' min</span><span>' + pol.freqMax + ' min</span></div></div>' +
      '<div class="field"><span class="label">Tipo de rutina</span><div class="chips">' + chip('routine', 'mixta', 'Mixta', w.prefs.routine) + chip('routine', 'respiracion', 'Solo respiración', w.prefs.routine) + chip('routine', 'movilidad', 'Solo movilidad', w.prefs.routine) + '</div></div>' +
      '<div class="field"><span class="label">Avisarme antes</span><div class="chips">' + chip('remind', 1, '1 min', w.prefs.remind) + chip('remind', 5, '5 min', w.prefs.remind) + chip('remind', 10, '10 min', w.prefs.remind) + '</div></div>' +
      '<div class="notice info">' + D2.icon('lock') + '<span><b>Definido por tu empresa</b>Pausas de ' + pol.dur + ' minutos, cada ' + pol.freqMin + ' a ' + pol.freqMax + ' minutos, entre ' + pol.start + ' y ' + pol.end + '. Puedes posponer ' + pol.maxPostpones + ' veces al día.</span></div>' +
      '<button class="btn btn-primary" type="submit">Guardar preferencias</button>' +
      '</form></section>' +
      '<div class="stack">' +
      '<section class="card"><div class="card-head"><div><h3>Esta semana</h3><p>Pausas completadas por día (de 4)</p></div></div>' +
      '<div class="week-bars" style="grid-template-columns:repeat(' + week.length + ',minmax(0,1fr))">' + week.map((d) =>
        '<div class="wb' + (d.today ? ' today' : '') + '" data-tip="<b>' + d.v + ' de 4</b>' + d.d + '"><b>' + d.v + '</b><i style="height:' + Math.max(4, (d.v / 4) * 80) + 'px"></i>' + d.d + '</div>').join('') + '</div>' +
      '<div class="grid g3" style="gap:10px"><div class="kpi"><span class="eyebrow">Semana pasada</span><span class="num" style="font-weight:800;font-size:1.3rem">85%</span></div><div class="kpi"><span class="eyebrow">Pospuestas</span><span class="num" style="font-weight:800;font-size:1.3rem">' + (3 + w.postponesUsed) + '</span></div><div class="kpi"><span class="eyebrow">Saltadas</span><span class="num" style="font-weight:800;font-size:1.3rem">' + (1 + w.skipReasons.length) + '</span></div></div>' +
      '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Durante tus pausas</h3><p>Se activa No molestar y estas apps quedan en pausa.</p></div></div>' +
      D2.DEVICES.map((d) => '<div class="device">' + D2.icon(d.kind) + '<div class="grow"><b>' + d.name + '</b><span>' + d.model + '</span></div><span class="pill pill-ok">Vinculado</span></div>').join('') +
      '<div class="app-tiles">' + D2.blockedApps().map((a) => '<span class="app-tile">' + D2.appTile(a) + a.name + D2.icon('lock', 'lock') + '</span>').join('') + '</div>' +
      '</section>' +
      '<section class="card flat"><h4>Probar en la demo</h4><p class="small ink2">El reloj de la demo parte a las 11:46. Usa estos atajos para ver cada momento.</p>' +
      '<div class="row"><button class="btn btn-quiet btn-sm" data-act="pause-test">' + D2.icon('bell') + 'Sonar la alarma</button><button class="btn btn-quiet btn-sm" data-act="pause-now">' + D2.icon('play') + 'Pausa ahora</button><button class="btn btn-quiet btn-sm" data-act="offhours">' + D2.icon('moon') + 'Fin de jornada</button></div></section>' +
      '</div></div></div>';
  };
  D2.changes['freq-out'] = (el) => { const o = document.getElementById('freq-out'); if (o) o.textContent = 'Cada ' + el.value + ' min'; };
  D2.forms.prefs = function (form) {
    const fd = new FormData(form);
    const w = D2.state.worker;
    w.prefs.freq = Number(fd.get('freq'));
    w.prefs.routine = fd.get('routine') || 'mixta';
    w.prefs.remind = Number(fd.get('remind') || 1);
    D2.save();
    D2.render();
    D2.toast('Preferencias guardadas. Próxima pausa: ' + (D2.nextSlot() ? D2.nextSlot().label : 'mañana'));
  };

  /* ---------- Encuesta ---------- */
  V.encuesta = function () {
    const w = D2.state.worker;
    if (w.survey) {
      return '<div class="page"><div class="page-head"><div><span class="eyebrow">Clima laboral · Septiembre 2026</span><h1>Gracias por responder</h1><p>Tus respuestas se sumaron a las de tu equipo sin tu nombre.</p></div></div>' +
        '<div class="grid g2"><section class="card"><h3>Qué pasa ahora</h3><div class="list">' +
        '<div class="list-item"><span class="icon-dot brand">' + D2.icon('users') + '</span><div class="grow"><b>Se suman a tu equipo</b><span class="small muted">Tu jefatura ve promedios solo si responden 5 o más personas.</span></div></div>' +
        '<div class="list-item"><span class="icon-dot brand">' + D2.icon('listcheck') + '</span><div class="grow"><b>Tu jefatura arma un plan</b><span class="small muted">Con los temas más bajos se definen acciones concretas.</span></div></div>' +
        '<div class="list-item"><span class="icon-dot brand">' + D2.icon('calendar') + '</span><div class="grow"><b>Próxima encuesta</b><span class="small muted">Fines de octubre. Siempre 6 preguntas.</span></div></div>' +
        '</div></section>' +
        '<section class="card flat"><h4>Si necesitas contar algo concreto</h4><p class="small ink2">La encuesta mide el ambiente general. Si viviste una situación de acoso, maltrato o discriminación, usa el canal de denuncias anónimo.</p><button class="btn btn-ghost" data-act="go" data-view="denuncias" data-tab="nueva">Ir al canal de denuncias</button></section></div></div>';
    }
    return '<div class="page"><div class="page-head"><div><span class="eyebrow">Clima laboral · Septiembre 2026</span><h1>¿Cómo estuvo tu mes?</h1><p>6 preguntas, 2 minutos. Anónima: nadie ve tus respuestas individuales.</p></div></div>' +
      '<div class="grid g-main"><section class="card"><form data-form="survey" novalidate>' +
      D2.DIMS.map((d, i) => '<fieldset class="q" style="border:0;margin:0;padding-inline:0"><legend class="visually-hidden">' + esc(d.q) + '</legend>' +
        '<div class="q-title"><span class="qn">' + String(i + 1).padStart(2, '0') + '</span><div><b>' + esc(d.q) + '</b><div class="q-dim">' + d.label + '</div></div></div>' +
        '<div class="likert">' + [1, 2, 3, 4, 5].map((v) => '<label><input type="radio" name="q_' + d.key + '" value="' + v + '"><span>' + v + '<small>' + D2.LIKERT[v - 1] + '</small></span></label>').join('') + '</div></fieldset>').join('') +
      '<div class="q"><label class="q-title" for="survey-open"><span class="qn">07</span><div><b>¿Qué cambiarías este mes para trabajar mejor?</b><div class="q-dim">Opcional · no escribas nombres si quieres mantener el anonimato</div></div></label>' +
      '<textarea id="survey-open" name="open" class="textarea" style="min-height:90px" maxlength="400" placeholder="Escribe aquí"></textarea></div>' +
      '<div class="row" style="padding-top:8px"><button class="btn btn-primary" type="submit">Enviar respuestas</button><span class="small" id="survey-error" style="color:var(--crit)" role="alert"></span></div>' +
      '</form></section>' +
      '<aside class="stack"><section class="card flat"><h4>Así protegemos tu anonimato</h4><div class="list">' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('eyeOff') + '</span><div class="grow small">Las respuestas se guardan sin tu nombre ni tu correo.</div></div>' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('users') + '</span><div class="grow small">Los equipos con menos de 5 respuestas no muestran resultados.</div></div>' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('message') + '</span><div class="grow small">Los comentarios se muestran sin fecha ni hora exacta.</div></div>' +
      '</div></section></aside></div></div>';
  };
  D2.forms.survey = function (form) {
    const fd = new FormData(form);
    const answers = {};
    let missing = 0;
    D2.DIMS.forEach((d) => { const v = fd.get('q_' + d.key); if (v) answers[d.key] = Number(v); else missing++; });
    if (missing) {
      document.getElementById('survey-error').textContent = 'Te falta' + (missing > 1 ? 'n ' + missing + ' preguntas' : ' 1 pregunta') + ' por responder.';
      return;
    }
    D2.state.worker.survey = { answers, open: String(fd.get('open') || '').trim() };
    D2.save();
    D2.render({ scroll: true });
    D2.toast('Respuestas enviadas de forma anónima');
  };

  /* ---------- Denuncias ---------- */
  V.denuncias = function () {
    const ui = D2.ui;
    const tab = ui.complaintTab;
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Canal anónimo · Ley Karin</span><h1>Canal de denuncias</h1><p>Llega directo al equipo de Personas de ' + D2.company.name + '. Nadie sabrá que fuiste tú.</p></div>' +
      '<div class="toggle-tabs" role="group" aria-label="Opciones"><button data-act="ctab" data-tab="nueva" aria-pressed="' + (tab === 'nueva') + '">Nueva denuncia</button><button data-act="ctab" data-tab="seguir" aria-pressed="' + (tab === 'seguir') + '">Seguir mi denuncia</button></div></div>' +
      '<section class="card flat"><div class="anon-points">' +
      '<div>' + D2.icon('eyeOff') + '<b>Sin nombre ni correo</b>No pedimos ni guardamos quién eres, tu IP ni tu dispositivo.</div>' +
      '<div>' + D2.icon('inbox') + '<b>Solo RR.HH. la recibe</b>Las jefaturas no tienen acceso a las denuncias.</div>' +
      '<div>' + D2.icon('message') + '<b>Conversación anónima</b>Con tu código ves el avance y respondes preguntas de RR.HH.</div>' +
      '</div></section>' +
      (tab === 'nueva' ? newComplaint() : followComplaint()) +
      '</div>';
  };

  function newComplaint() {
    const ui = D2.ui;
    if (ui.newCode) {
      return '<section class="card" style="max-width:720px"><div class="row nowrap"><span class="icon-dot ok">' + D2.icon('check') + '</span><div><h2>Denuncia enviada</h2><p class="small muted">RR.HH. la recibió recién. Tu identidad no quedó registrada.</p></div></div>' +
        '<div class="field"><span class="label">Tu código de seguimiento</span><div class="code-box"><span class="code" id="new-code">' + ui.newCode + '</span><button class="btn btn-quiet btn-sm" data-act="copy-code">' + D2.icon('copy') + (ui.copied ? 'Copiado' : 'Copiar') + '</button></div></div>' +
        '<div class="notice warn">' + D2.icon('alert') + '<span><b>Guarda este código ahora</b>Es la única forma de ver el avance y conversar con RR.HH. Si lo pierdes no podemos recuperarlo, porque no sabemos quién eres.</span></div>' +
        '<div class="row"><button class="btn btn-primary" data-act="follow-new">Ver mi denuncia</button><button class="btn btn-ghost" data-act="new-again">Hacer otra denuncia</button></div></section>';
    }
    const areaOpts = '<option>Prefiero no decirlo</option>' + D2.AREAS.map((a) => '<option>' + a.name + '</option>').join('');
    return '<section class="card"><form data-form="complaint" class="stack" style="gap:20px" novalidate>' +
      '<div class="field"><span class="label">¿Qué tipo de situación quieres denunciar?</span><div class="choice-grid">' +
      D2.CATEGORIES.map((c) => '<label class="choice"><input type="radio" name="cat" value="' + c.id + '"><b>' + c.name + '</b><span>' + c.hint + '</span></label>').join('') + '</div></div>' +
      '<div class="field"><label for="c-desc">¿Qué pasó?</label><textarea id="c-desc" name="desc" class="textarea" maxlength="2000" placeholder="Qué pasó, cuándo y dónde. Puedes escribir con tus palabras."></textarea>' +
      '<span class="hint">Si quieres mantener el anonimato, evita datos que te identifiquen (tu nombre, tu turno exacto).</span></div>' +
      '<div class="grid g2"><div class="field"><label for="c-where">¿Dónde ocurrió?</label><select id="c-where" name="where" class="select">' + areaOpts + '</select></div>' +
      '<div class="field"><label for="c-when">¿Cuándo ocurrió?</label><select id="c-when" name="when" class="select"><option>Esta semana</option><option>Último mes</option><option>Hace más de un mes</option><option>Sigue pasando</option></select></div></div>' +
      '<div class="field"><span class="label">¿Ha pasado más de una vez?</span><div class="chips">' + ['Sí', 'No', 'No estoy seguro'].map((v, i) => '<label class="chip-radio"><input type="radio" name="recurrent" value="' + v + '"' + (i === 0 ? ' checked' : '') + '><span>' + v + '</span></label>').join('') + '</div></div>' +
      '<div class="field"><label for="c-wit">¿Hubo testigos? <span class="muted">(opcional)</span></label><input id="c-wit" name="witnesses" class="input" placeholder="Por ejemplo: dos personas del equipo"></div>' +
      '<div class="field"><label for="c-files">Adjuntar evidencia <span class="muted">(opcional)</span></label><input id="c-files" name="files" type="file" multiple class="input">' +
      '<span class="hint">Fotos, capturas o documentos. Antes de enviarlos borramos sus metadatos (autor, ubicación y fecha).</span></div>' +
      '<label class="switch" style="border-top:1px solid var(--line)"><span class="txt"><b>Necesito medidas de protección</b><span>Por ejemplo, separar espacios o turnos mientras se investiga.</span></span><input type="checkbox" name="protection"></label>' +
      '<div class="notice warn">' + D2.icon('alert') + '<span><b>Si estás en peligro ahora</b>Llama al 133 (Carabineros). Este canal no es para emergencias.</span></div>' +
      '<div class="row"><button class="btn btn-primary" type="submit">' + D2.icon('send') + 'Enviar denuncia anónima</button><span class="small" id="c-error" style="color:var(--crit)" role="alert"></span></div>' +
      '</form></section>';
  }

  function followComplaint() {
    const ui = D2.ui;
    const c = ui.followCode && D2.state.complaints.find((x) => x.code === ui.followCode);
    let html = '<section class="card"><form data-form="follow" class="row" style="align-items:flex-end" novalidate>' +
      '<div class="field" style="flex:1;min-width:220px"><label for="f-code">Código de seguimiento</label><input id="f-code" name="code" class="input mono" placeholder="D2-XXXX-XXXX" autocomplete="off" value="' + esc(ui.followCode || '') + '"></div>' +
      '<button class="btn btn-primary" type="submit">Ver estado</button></form>' +
      (ui.followError ? '<p class="small" style="color:var(--crit)" role="alert">' + esc(ui.followError) + '</p>' : '') +
      (!c ? '<p class="small muted">Para la demo puedes usar el código <button class="link mono" data-act="demo-code">D2-4HQM-72KP</button>.</p>' : '') +
      '</section>';
    if (c) {
      const dl = D2.deadlineInfo(c);
      html += '<div class="grid g-main">' +
        '<section class="card"><div class="card-head"><div><span class="eyebrow mono">' + c.code + '</span><h3>' + D2.catName(c.cat) + '</h3><p>Enviada el ' + D2.fmtDate(c.received) + '</p></div>' + D2.statusPill(c.status) + '</div>' +
        D2.stepper(c.status) +
        '<div class="divider"></div><h4>Conversación con RR.HH.</h4>' + D2.chatHtml(c, 'worker') +
        (c.status < 3
          ? '<form data-form="worker-msg" class="chat-input"><label class="visually-hidden" for="w-msg">Mensaje</label><textarea id="w-msg" name="msg" class="textarea" placeholder="Escribe tu mensaje. Sigue siendo anónimo." maxlength="1000"></textarea><button class="btn btn-primary" type="submit" aria-label="Enviar">' + D2.icon('send') + '</button></form>'
          : '<div class="notice">' + D2.icon('check') + '<span><b>Caso resuelto</b>' + esc(c.resolution || '') + '</span></div>') +
        '</section>' +
        '<aside class="stack"><section class="card flat"><h4>Lo que enviaste</h4><p class="small ink2">' + esc(c.desc) + '</p>' +
        '<div class="small muted">Dónde: ' + esc(c.where) + ' · Cuándo: ' + esc(c.when) + '</div></section>' +
        (c.status < 3 ? '<section class="card flat"><h4>Plazos</h4><p class="small ink2">RR.HH. tiene ' + D2.DEADLINE_DAYS + ' días para investigar. Van ' + dl.days + ' días.</p><p class="small muted">Para la demo: cambia a la vista RR.HH., responde este caso y vuelve aquí.</p></section>' : '') +
        '</aside></div>';
    }
    return html;
  }

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    const pick = (n) => Array.from({ length: n }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    return 'D2-' + pick(4) + '-' + pick(4);
  }

  D2.forms.complaint = function (form) {
    const fd = new FormData(form);
    const err = document.getElementById('c-error');
    const cat = fd.get('cat');
    const desc = String(fd.get('desc') || '').trim();
    if (!cat) { err.textContent = 'Elige el tipo de situación.'; return; }
    if (desc.length < 30) { err.textContent = 'Cuéntanos un poco más (mínimo 30 caracteres).'; document.getElementById('c-desc').focus(); return; }
    const files = Array.from(form.querySelector('#c-files').files || []).map((f) => f.name);
    const code = newCode();
    const today = D2.stamp();
    D2.state.complaints.unshift({
      code, cat, received: today.slice(0, 10), status: 0, unread: true,
      where: fd.get('where'), when: fd.get('when'), recurrent: fd.get('recurrent'), witnesses: String(fd.get('witnesses') || ''),
      protection: !!fd.get('protection'), files, desc, dtReport: false,
      messages: [{ from: 'system', text: 'Denuncia recibida', at: today }],
    });
    D2.ui.newCode = code;
    D2.ui.copied = false;
    D2.save();
    D2.render({ scroll: true });
  };
  D2.forms.follow = function (form) {
    const code = String(new FormData(form).get('code') || '').trim().toUpperCase();
    const found = D2.state.complaints.find((c) => c.code === code);
    D2.ui.followCode = found ? code : null;
    D2.ui.followError = found ? '' : 'No encontramos ese código. Revisa que esté bien escrito (D2-XXXX-XXXX).';
    D2.render();
    scrollChat();
  };
  D2.forms['worker-msg'] = function (form) {
    const text = String(new FormData(form).get('msg') || '').trim();
    if (!text) return;
    const c = D2.state.complaints.find((x) => x.code === D2.ui.followCode);
    c.messages.push({ from: 'me', text, at: D2.stamp() });
    c.unread = true;
    D2.save();
    D2.render();
    scrollChat();
  };
  Object.assign(D2.actions, {
    ctab(el) { D2.ui.complaintTab = el.dataset.tab; D2.render(); scrollChat(); },
    'demo-code'() { D2.ui.followCode = 'D2-4HQM-72KP'; D2.ui.followError = ''; D2.render(); scrollChat(); },
    'follow-new'() { D2.ui.followCode = D2.ui.newCode; D2.ui.newCode = null; D2.ui.complaintTab = 'seguir'; D2.render(); scrollChat(); },
    'new-again'() { D2.ui.newCode = null; D2.render(); },
    'copy-code'(el) {
      const code = D2.ui.newCode;
      const done = () => { D2.ui.copied = true; el.innerHTML = D2.icon('check') + 'Copiado'; };
      try {
        navigator.clipboard.writeText(code).then(done, () => selectCode());
      } catch (e) { selectCode(); }
    },
  });
  function selectCode() {
    const el = document.getElementById('new-code');
    if (!el) return;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    D2.toast('Código seleccionado. Cópialo con Ctrl+C o mantén presionado.', 'copy');
  }
})();
</script>
<script>
/* Desconecta2 · vista RR.HH. (panel de la empresa). */
(function () {
  const D2 = window.D2;
  const V = D2.views.rrhh;
  const esc = D2.esc;

  /* ---------- Datos agregados ---------- */
  D2.areaData = function () {
    const s = D2.state.worker.survey;
    return D2.AREAS.map((a) => {
      let resp = a.resp;
      const scores = Object.assign({}, a.scores);
      if (s && a.id === 'ops') {
        resp = a.resp + 1;
        D2.DIMS.forEach((d) => { scores[d.key] = (a.scores[d.key] * a.resp + s.answers[d.key]) / resp; });
      }
      const index = D2.avg(D2.DIMS.map((d) => scores[d.key]));
      return Object.assign({}, a, { resp, scores, index, visible: resp >= D2.MIN_RESPONSES });
    });
  };
  D2.companyScores = function () {
    const areas = D2.areaData();
    const total = areas.reduce((n, a) => n + a.resp, 0);
    const scores = {};
    D2.DIMS.forEach((d) => { scores[d.key] = areas.reduce((n, a) => n + a.scores[d.key] * a.resp, 0) / total; });
    return { scores, index: D2.avg(D2.DIMS.map((d) => scores[d.key])), resp: total };
  };
  D2.pauseByArea = function () {
    return D2.AREAS.map((a) => {
      const ps = D2.PEOPLE.filter((p) => p.area === a.id);
      const sch = ps.reduce((n, p) => n + p.scheduled, 0);
      const done = ps.reduce((n, p) => n + p.completed, 0);
      return { id: a.id, name: a.name, pct: (done / sch) * 100, done, sch };
    });
  };
  D2.dimLabel = (k) => D2.DIMS.find((d) => d.key === k).label;

  D2.hbars = function (rows, opts) {
    opts = opts || {};
    const max = opts.max || 5;
    return '<div class="hbars">' + rows.map((r) => {
      const w1 = (r.v / max) * 100;
      const tip = '<b>' + esc(r.label) + '</b>' + (opts.s1 || '') + ': ' + (opts.fmt || D2.f1)(r.v) + (r.v2 != null ? '<br>' + (opts.s2 || '') + ': ' + (opts.fmt || D2.f1)(r.v2) : '');
      return '<div class="hbar" data-tip="' + esc(tip) + '"><div class="lbl">' + esc(r.label) + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</div>' +
        '<div class="bars"><div class="bar" style="width:' + w1 + '%"></div>' + (r.v2 != null ? '<div class="bar s2" style="width:' + (r.v2 / max) * 100 + '%"></div>' : '') +
        (opts.target != null ? '<span class="target" style="left:' + (opts.target / max) * 100 + '%"></span>' : '') + '</div>' +
        '<div class="val">' + (opts.fmt || D2.f1)(r.v) + '</div></div>';
    }).join('') + '</div>';
  };

  /* ---------- Resumen ---------- */
  V.resumen = function () {
    const comp = D2.companyScores();
    const areas = D2.areaData();
    const open = D2.state.complaints.filter((c) => c.status < 3);
    const unread = D2.state.complaints.filter((c) => c.unread);
    const totalResp = comp.resp;
    const lowestDim = D2.DIMS.slice().sort((a, b) => comp.scores[a.key] - comp.scores[b.key])[0];
    const lowestArea = areas.filter((a) => a.visible).sort((a, b) => a.index - b.index)[0];
    const trend = [3.21, 3.25, 3.3, 3.34, 3.41, comp.index];
    const attention = [];
    unread.forEach((c) => attention.push({ cls: 'crit', icon: 'inbox', t: 'Denuncia sin leer · ' + D2.catName(c.cat), s: c.code + ' · recibida el ' + D2.fmtDate(c.received), act: 'open-case', code: c.code }));
    open.filter((c) => !c.unread).forEach((c) => { const dl = D2.deadlineInfo(c); if (dl.left <= 20) attention.push({ cls: dl.left <= 10 ? 'crit' : 'warn', icon: 'clock', t: 'Quedan ' + dl.left + ' días para cerrar la investigación', s: c.code + ' · ' + D2.catName(c.cat), act: 'open-case', code: c.code }); });
    attention.push({ cls: 'warn', icon: 'down', t: lowestDim.label + ' es lo más bajo del mes (' + D2.f1(comp.scores[lowestDim.key]) + ')', s: 'Bajo la meta de 3,5 en ' + areas.filter((a) => a.visible && a.scores[lowestDim.key] < D2.TARGET).length + ' de ' + areas.filter((a) => a.visible).length + ' áreas visibles', act: 'go', view: 'clima' });
    attention.push({ cls: 'warn', icon: 'users', t: lowestArea.name + ' tiene el clima más bajo (' + D2.f1(lowestArea.index) + ')', s: 'Su jefatura tiene un plan de acción en curso', act: 'go', view: 'clima' });
    attention.push({ cls: 'info', icon: 'calendar', t: '38 pausas saltadas por reuniones este mes', s: 'Considera no agendar reuniones en horario de pausa', act: 'go', view: 'pausas' });

    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">' + D2.company.name + ' · 48 personas</span><h1>Resumen</h1><p>Clima laboral, pausas activas y denuncias en un solo lugar.</p></div></div>' +
      '<div class="grid g4">' +
      kpi('Cumplimiento de pausas', '81<small>%</small>', '+3 pts', true, 'Semana del 28 sep') +
      kpi('Índice de clima', D2.f2(comp.index) + '<small> /5</small>', '+' + D2.f2(comp.index - 3.41), true, 'Septiembre vs agosto') +
      kpi('Participación encuesta', Math.round((totalResp / 48) * 100) + '<small>%</small>', null, null, totalResp + ' de 48 personas') +
      kpi('Denuncias abiertas', open.length, null, null, unread.length ? '<span class="pill pill-crit">' + unread.length + ' sin leer</span>' : 'Todas revisadas') +
      '</div>' +
      '<div class="grid g-main">' +
      '<div class="stack">' +
      '<section class="card"><div class="card-head"><div><h3>Cumplimiento semanal de pausas</h3><p>% de pausas completadas sobre las programadas</p></div></div>' +
      D2.chartSlot({ labels: D2.WEEKS, values: D2.WEEKLY_COMPANY, min: 40, max: 100, ticks: [40, 60, 80, 100], fmt: (v) => v + '%', goal: 80, goalLabel: 'Meta 80%', tipPrefix: 'Semana del ', aria: 'Cumplimiento semanal de pausas, de 58% a 81% en 8 semanas' }) + '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Índice de clima laboral</h3><p>Promedio de las 6 dimensiones, escala 1 a 5</p></div></div>' +
      D2.chartSlot({ labels: D2.MONTHS, values: trend, min: 3, max: 4, ticks: [3, 3.5, 4], fmt: (v) => D2.f1(v), endFmt: (v) => D2.f2(v), goal: 3.5, goalLabel: 'Meta 3,5', aria: 'Índice de clima de abril a septiembre', height: 200 }) + '</section>' +
      '</div>' +
      '<section class="card"><div class="card-head"><div><h3>Requiere atención</h3><p>Ordenado por urgencia</p></div></div><div class="list">' +
      attention.map((a) => '<button class="list-item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-act="' + a.act + '"' + (a.code ? ' data-code="' + a.code + '"' : '') + (a.view ? ' data-view="' + a.view + '"' : '') + '><span class="icon-dot ' + a.cls + '">' + D2.icon(a.icon) + '</span><span class="grow"><b class="small">' + esc(a.t) + '</b><span class="xs muted">' + esc(a.s) + '</span></span></button>').join('') +
      '</div></section>' +
      '</div></div>';
  };
  function kpi(label, value, delta, up, sub) {
    return '<section class="card kpi"><span class="eyebrow">' + label + '</span><span class="kpi-value">' + value + '</span>' +
      '<span class="row small muted" style="gap:8px">' + (delta ? '<span class="delta ' + (up ? 'up' : 'down') + '">' + D2.icon(up ? 'up' : 'down') .replace('<svg', '<svg width="14" height="14"') + delta + '</span>' : '') + sub + '</span></section>';
  }
  D2.kpi = kpi;

  /* ---------- Denuncias ---------- */
  V.denuncias = function () {
    if (D2.ui.rrhhCase) return caseDetail(D2.state.complaints.find((c) => c.code === D2.ui.rrhhCase));
    const f = D2.ui.rrhhFilter;
    const all = D2.state.complaints;
    const list = all.filter((c) => (f === 'abiertas' ? c.status < 3 : f === 'resueltas' ? c.status === 3 : true));
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Canal anónimo · Ley Karin</span><h1>Denuncias</h1><p>Solo el equipo de Personas ve esta sección. Las jefaturas no tienen acceso.</p></div>' +
      '<div class="toggle-tabs" role="group" aria-label="Filtrar">' + [['abiertas', 'Abiertas'], ['resueltas', 'Resueltas'], ['todas', 'Todas']].map((t) => '<button data-act="rfilter" data-f="' + t[0] + '" aria-pressed="' + (f === t[0]) + '">' + t[1] + '</button>').join('') + '</div></div>' +
      '<div class="notice">' + D2.icon('eyeOff') + '<span><b>Identidad protegida</b>Desconecta2 no registra nombre, correo, IP ni dispositivo de quien denuncia. Solo ves lo que la persona escribió y puedes conversar con ella de forma anónima.</span></div>' +
      '<section class="card">' + (list.length ? '<div class="table-wrap"><table><thead><tr><th>Código</th><th>Tipo</th><th>Recibida</th><th>Estado</th><th>Plazo</th><th class="r">Mensajes</th></tr></thead><tbody>' +
        list.map((c) => {
          const dl = D2.deadlineInfo(c);
          const plazo = c.status === 3 ? '<span class="muted">Cerrada</span>' : '<span class="pill ' + (dl.left <= 10 ? 'pill-crit' : dl.left <= 20 ? 'pill-warn' : 'pill-neutral') + ' nodot num">' + dl.left + ' días</span>';
          return '<tr class="clickable" data-act="open-case" data-code="' + c.code + '"><td class="mono" style="white-space:nowrap">' + (c.unread ? '<b>' + c.code + '</b> <span class="pill pill-crit nodot">Nueva</span>' : c.code) + '</td><td>' + D2.catName(c.cat) + (c.protection ? '<div class="xs muted">Pide medidas de protección</div>' : '') + '</td><td class="num" style="white-space:nowrap">' + D2.fmtDate(c.received) + '</td><td>' + D2.statusPill(c.status) + '</td><td>' + plazo + '</td><td class="r num">' + c.messages.filter((m) => m.from !== 'system').length + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">' + D2.icon('inbox') + '<span>No hay denuncias en esta vista.</span></div>') +
      '</section></div>';
  };

  function caseDetail(c) {
    if (!c) { D2.ui.rrhhCase = null; return V.denuncias(); }
    const dl = D2.deadlineInfo(c);
    const pctDays = Math.min(100, (dl.days / D2.DEADLINE_DAYS) * 100);
    return '<div class="page">' +
      '<div><button class="btn btn-quiet btn-sm" data-act="close-case">' + D2.icon('back') + 'Todas las denuncias</button></div>' +
      '<div class="page-head"><div><span class="eyebrow mono">' + c.code + '</span><h1>' + D2.catName(c.cat) + '</h1><p>Recibida el ' + D2.fmtDate(c.received) + ' · denunciante anónimo</p></div>' + D2.statusPill(c.status) + '</div>' +
      '<div class="grid g-main">' +
      '<div class="stack">' +
      '<section class="card"><h3>Relato</h3><p class="ink2">' + esc(c.desc) + '</p>' +
      '<div class="grid g2" style="gap:10px">' +
      info('Dónde', c.where) + info('Cuándo', c.when) + info('¿Más de una vez?', c.recurrent) + info('Testigos', c.witnesses || 'No indica') +
      '</div>' +
      (c.files && c.files.length ? '<div class="row">' + c.files.map((f) => '<span class="pill pill-neutral nodot">' + D2.icon('file').replace('<svg', '<svg width="14" height="14"') + esc(f) + '</span>').join('') + '</div>' : '') +
      '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Conversación anónima</h3><p>Respondes como "Equipo de Personas". La persona lo ve con su código.</p></div></div>' +
      D2.chatHtml(c, 'rrhh') +
      (c.status < 3 ? '<form data-form="rrhh-msg" class="chat-input"><label class="visually-hidden" for="r-msg">Respuesta</label><textarea id="r-msg" name="msg" class="textarea" placeholder="Escribe una respuesta o pide más antecedentes" maxlength="1000"></textarea><button class="btn btn-primary" type="submit" aria-label="Enviar">' + D2.icon('send') + '</button></form>' : '') +
      '</section></div>' +
      '<aside class="stack">' +
      '<section class="card"><h4>Estado del caso</h4>' + D2.stepper(c.status) +
      '<div class="row">' + D2.STATUSES.map((s, i) => '<button class="btn btn-sm ' + (i === c.status ? 'btn-primary' : 'btn-ghost') + '" data-act="set-status" data-s="' + i + '"' + (i === c.status ? ' aria-pressed="true"' : '') + '>' + s + '</button>').join('') + '</div>' +
      (c.status === 3 && c.resolution ? '<p class="small ink2"><b>Resolución:</b> ' + esc(c.resolution) + '</p>' : '') +
      '</section>' +
      (c.status < 3 ? '<section class="card"><div class="row between"><h4>Plazo de investigación</h4><span class="num small"><b>Día ' + dl.days + '</b> de ' + D2.DEADLINE_DAYS + '</span></div>' +
        '<div class="minibar"><div class="track"><div class="fill ' + (dl.left <= 10 ? 'crit' : dl.left <= 20 ? 'low' : '') + '" style="width:' + pctDays + '%"></div></div></div>' +
        '<p class="xs muted">Vence el ' + venc(c) + '. Configurable según tu reglamento interno.</p></section>' : '') +
      '<section class="card"><div class="row between"><h4>Medidas de resguardo</h4>' + (c.protection ? '<span class="pill pill-warn">Solicitadas</span>' : '') + '</div>' +
      ((c.measures || []).length ? '<div class="list">' + c.measures.map((m) => '<div class="list-item small"><span class="icon-dot ok">' + D2.icon('check') + '</span><span class="grow">' + esc(m) + '</span></div>').join('') + '</div>' : '<p class="small muted">Aún no registras medidas.</p>') +
      (c.status < 3 ? '<form data-form="measure" class="stack"><label class="visually-hidden" for="m-text">Nueva medida</label><input id="m-text" name="m" class="input" placeholder="Ej: separar turnos mientras se investiga"><button class="btn btn-ghost btn-sm" type="submit">Registrar medida</button></form>' : '') +
      '</section>' +
      '<section class="card"><h4>Dirección del Trabajo</h4><label class="switch"><span class="txt"><b>Informe de investigación enviado</b><span>Registra cuándo envías las conclusiones.</span></span><input type="checkbox" data-change="dt-report"' + (c.dtReport ? ' checked' : '') + '></label></section>' +
      '</aside></div></div>';
  }
  function info(k, v) { return '<div class="comment" style="gap:2px"><span class="xs muted">' + k + '</span><b class="small">' + esc(v) + '</b></div>'; }
  function venc(c) { const d = D2.parseDate(c.received); d.setDate(d.getDate() + D2.DEADLINE_DAYS); return d.getDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][d.getMonth()]; }
  const current = () => D2.state.complaints.find((c) => c.code === D2.ui.rrhhCase);

  Object.assign(D2.actions, {
    'open-case'(el) {
      D2.state.role = 'rrhh';
      D2.state.view.rrhh = 'denuncias';
      D2.ui.rrhhCase = el.dataset.code;
      const c = current();
      if (c) c.unread = false;
      D2.save();
      D2.render({ scroll: true });
      D2.scrollChat();
    },
    'close-case'() { D2.ui.rrhhCase = null; D2.render({ scroll: true }); },
    rfilter(el) { D2.ui.rrhhFilter = el.dataset.f; D2.render(); },
    'set-status'(el) {
      const c = current();
      const s = Number(el.dataset.s);
      if (s === c.status) return;
      c.status = s;
      if (s === 3 && !c.resolution) c.resolution = 'Caso cerrado por el equipo de Personas.';
      c.messages.push({ from: 'system', text: 'Estado cambiado a "' + D2.STATUSES[s] + '"', at: D2.stamp() });
      D2.save();
      D2.render();
      D2.scrollChat();
      D2.toast('Estado actualizado: ' + D2.STATUSES[s]);
    },
  });
  D2.forms['rrhh-msg'] = function (form) {
    const text = String(new FormData(form).get('msg') || '').trim();
    if (!text) return;
    current().messages.push({ from: 'rrhh', text, at: D2.stamp() });
    D2.save();
    D2.render();
    D2.scrollChat();
    D2.toast('Respuesta enviada. La persona la verá con su código.', 'send');
  };
  D2.forms.measure = function (form) {
    const text = String(new FormData(form).get('m') || '').trim();
    if (!text) return;
    const c = current();
    c.measures = (c.measures || []).concat(text);
    c.messages.push({ from: 'system', text: 'Medida de resguardo registrada', at: D2.stamp() });
    D2.save();
    D2.render();
  };
  D2.changes['dt-report'] = function (el) {
    current().dtReport = el.checked;
    D2.save();
    D2.toast(el.checked ? 'Envío a la Dirección del Trabajo registrado' : 'Envío desmarcado');
  };

  /* ---------- Clima ---------- */
  V.clima = function () {
    const comp = D2.companyScores();
    const areas = D2.areaData();
    const sorted = D2.DIMS.slice().sort((a, b) => comp.scores[b.key] - comp.scores[a.key]);
    const comments = D2.COMMENTS.slice();
    const own = D2.state.worker.survey;
    if (own && own.open) comments.unshift({ area: 'ops', dim: null, text: own.open, isNew: true });
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Encuesta mensual · Septiembre 2026</span><h1>Clima laboral</h1><p>Resultados agregados. Las áreas con menos de ' + D2.MIN_RESPONSES + ' respuestas no se muestran, para proteger el anonimato.</p></div></div>' +
      '<div class="grid g4">' +
      kpi('Índice general', D2.f2(comp.index) + '<small> /5</small>', '+' + D2.f2(comp.index - 3.41), true, 'vs agosto') +
      kpi('Participación', Math.round((comp.resp / 48) * 100) + '<small>%</small>', null, null, comp.resp + ' de 48 respondieron') +
      kpi('Lo más alto', D2.f1(comp.scores[sorted[0].key]), null, null, sorted[0].label) +
      kpi('Lo más bajo', D2.f1(comp.scores[sorted[sorted.length - 1].key]), null, null, sorted[sorted.length - 1].label) +
      '</div>' +
      '<div class="grid g2">' +
      '<section class="card"><div class="card-head"><div><h3>Por dimensión</h3><p>Promedio de la empresa, escala 1 a 5</p></div><div class="legend"><span><i class="dash"></i>Meta 3,5</span></div></div>' +
      D2.hbars(D2.DIMS.map((d) => ({ label: d.label, v: comp.scores[d.key] })), { target: D2.TARGET, s1: 'Empresa' }) + '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Evolución del índice</h3><p>Abril a septiembre 2026</p></div></div>' +
      D2.chartSlot({ labels: D2.MONTHS, values: [3.21, 3.25, 3.3, 3.34, 3.41, comp.index], min: 3, max: 4, ticks: [3, 3.5, 4], fmt: (v) => D2.f1(v), endFmt: (v) => D2.f2(v), goal: 3.5, goalLabel: 'Meta 3,5', aria: 'Evolución del índice de clima', height: 230 }) + '</section>' +
      '</div>' +
      '<section class="card"><div class="card-head"><div><h3>Por área y dimensión</h3><p>Pasa el cursor por una celda para ver el detalle</p></div>' +
      '<div class="heat-legend"><span>Bajo la meta</span><span class="ramp"></span><span>Sobre la meta</span></div></div>' +
      '<div class="table-wrap"><table class="heat"><thead><tr><th>Área</th>' + D2.DIMS.map((d) => '<th>' + d.label + '</th>').join('') + '<th>Índice</th><th class="r">Respuestas</th></tr></thead><tbody>' +
      areas.map((a) => {
        if (!a.visible) return '<tr><td><b>' + a.name + '</b></td><td class="hidden-cell" colspan="' + (D2.DIMS.length + 1) + '">' + D2.icon('eyeOff').replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px;margin-right:6px"') + 'Oculto para proteger el anonimato: ' + a.resp + ' respuestas, mínimo ' + D2.MIN_RESPONSES + '</td><td class="r num">' + a.resp + '/' + a.size + '</td></tr>';
        return '<tr><td><b>' + a.name + '</b></td>' + D2.DIMS.map((d) => { const v = a.scores[d.key]; return '<td class="cell" style="' + D2.heatBg(v) + '" data-tip="' + esc('<b>' + D2.f1(v) + '</b>' + a.name + ' · ' + d.label) + '">' + D2.f1(v) + '</td>'; }).join('') +
          '<td class="cell" style="' + D2.heatBg(a.index) + '"><b>' + D2.f2(a.index) + '</b></td><td class="r num">' + a.resp + '/' + a.size + '</td></tr>';
      }).join('') + '</tbody></table></div></section>' +
      '<section class="card"><div class="card-head"><div><h3>Comentarios anónimos</h3><p>Respuestas a "¿Qué cambiarías este mes para trabajar mejor?"</p></div><span class="pill pill-neutral nodot">' + comments.length + ' comentarios</span></div>' +
      '<div class="grid g2" style="gap:10px">' + comments.map((c) => '<div class="comment"><q>' + esc(c.text) + '</q><span class="meta">' + D2.AREAS.find((a) => a.id === c.area).name + (c.dim ? ' · ' + D2.dimLabel(c.dim) : '') + (c.isNew ? ' · <b style="color:var(--brand)">Nuevo</b>' : '') + '</span></div>').join('') + '</div></section>' +
      '</div>';
  };

  /* ---------- Pausas ---------- */
  V.pausas = function () {
    const ppl = D2.PEOPLE;
    const sch = ppl.reduce((n, p) => n + p.scheduled, 0);
    const done = ppl.reduce((n, p) => n + p.completed, 0);
    const post = ppl.reduce((n, p) => n + p.postponed, 0);
    const skip = ppl.reduce((n, p) => n + p.skipped, 0);
    const byArea = D2.pauseByArea();
    const areaOpts = '<option value="all">Todas las áreas</option>' + D2.AREAS.map((a) => '<option value="' + a.id + '"' + (D2.ui.peopleArea === a.id ? ' selected' : '') + '>' + a.name + '</option>').join('');
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Semana del 28 de septiembre</span><h1>Pausas activas</h1><p>Cumplimiento por área y por persona. Cada pausa dura ' + D2.state.policy.dur + ' minutos.</p></div></div>' +
      '<div class="grid g4">' +
      kpi('Cumplimiento', Math.round((done / sch) * 100) + '<small>%</small>', '+3 pts', true, 'vs semana anterior') +
      kpi('Completadas', done, null, null, 'de ' + sch + ' programadas') +
      kpi('Pospuestas', post, null, null, 'Máximo ' + D2.state.policy.maxPostpones + ' por día') +
      kpi('Saltadas', skip, null, null, 'Con motivo registrado') +
      '</div>' +
      '<div class="grid g2">' +
      '<section class="card"><div class="card-head"><div><h3>Cumplimiento semanal</h3><p>Desde que se activó Desconecta2</p></div></div>' +
      D2.chartSlot({ labels: D2.WEEKS, values: D2.WEEKLY_COMPANY, min: 40, max: 100, ticks: [40, 60, 80, 100], fmt: (v) => v + '%', goal: 80, goalLabel: 'Meta 80%', tipPrefix: 'Semana del ', aria: 'Cumplimiento semanal de pausas' }) + '</section>' +
      '<div class="stack">' +
      '<section class="card"><div class="card-head"><div><h3>Por área</h3><p>% de pausas completadas</p></div><div class="legend"><span><i class="dash"></i>Meta 80%</span></div></div>' +
      D2.hbars(byArea.map((a) => ({ label: a.name, v: a.pct })), { max: 100, target: 80, fmt: (v) => Math.round(v) + '%', s1: 'Cumplimiento' }) + '</section>' +
      '<section class="card"><div class="card-head"><div><h3>Motivos para saltar</h3><p>Últimos 30 días</p></div></div>' +
      D2.hbars(D2.SKIP_REASONS.map((r) => ({ label: r.label, v: r.n })), { max: 40, fmt: (v) => String(v), s1: 'Pausas' }) + '</section>' +
      '</div></div>' +
      '<section class="card"><div class="card-head"><div><h3>Por persona</h3><p>Ordenado de menor a mayor cumplimiento</p></div>' +
      '<div class="row"><label class="visually-hidden" for="pq">Buscar persona</label><input id="pq" class="input" style="width:200px" placeholder="Buscar persona" value="' + esc(D2.ui.peopleQuery) + '" data-input="people-q">' +
      '<label class="visually-hidden" for="pa">Área</label><select id="pa" class="select" style="width:auto" data-change="people-area">' + areaOpts + '</select></div></div>' +
      '<div class="notice info">' + D2.icon('alert') + '<span>Estos datos son identificados. Informa en el reglamento interno que se registran las pausas y para qué se usan.</span></div>' +
      '<div class="table-wrap" id="people-table">' + peopleTable() + '</div></section>' +
      '</div>';
  };
  function peopleTable() {
    const q = D2.ui.peopleQuery.toLowerCase();
    const rows = D2.PEOPLE.filter((p) => (D2.ui.peopleArea === 'all' || p.area === D2.ui.peopleArea) && (!q || p.name.toLowerCase().includes(q)))
      .slice().sort((a, b) => a.completed / a.scheduled - b.completed / b.scheduled);
    if (!rows.length) return '<div class="empty">' + D2.icon('search') + '<span>Nadie coincide con la búsqueda.</span></div>';
    return '<table><thead><tr><th>Persona</th><th>Área</th><th class="hide-mobile">Cargo</th><th style="min-width:160px">Cumplimiento</th><th class="r">Completadas</th><th class="r">Pospuestas</th><th class="r">Saltadas</th></tr></thead><tbody>' +
      rows.map((p) => '<tr><td style="white-space:nowrap"><span class="row nowrap" style="gap:8px"><span class="avatar" style="width:28px;height:28px;font-size:11px">' + D2.initials(p.name) + '</span>' + esc(p.name) + '</span></td><td style="white-space:nowrap">' + D2.AREAS.find((a) => a.id === p.area).name + '</td><td class="hide-mobile muted">' + p.cargo + '</td><td>' + D2.minibar(p.completed, p.scheduled) + '</td><td class="r num">' + p.completed + '/' + p.scheduled + '</td><td class="r num">' + p.postponed + '</td><td class="r num">' + p.skipped + '</td></tr>').join('') +
      '</tbody></table>';
  }
  D2.peopleTable = peopleTable;
  D2.changes['people-q'] = function (el) { D2.ui.peopleQuery = el.value; document.getElementById('people-table').innerHTML = peopleTable(); };
  D2.changes['people-area'] = function (el) { D2.ui.peopleArea = el.value; document.getElementById('people-table').innerHTML = peopleTable(); };

  /* ---------- Políticas ---------- */
  V.politicas = function () {
    const p = D2.state.policy;
    const sel = (name, vals, cur, fmt) => '<select id="pol-' + name + '" name="' + name + '" class="select">' + vals.map((v) => '<option value="' + v + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + (fmt ? fmt(v) : v) + '</option>').join('') + '</select>';
    const sw = (name, title, sub, on) => '<label class="switch"><span class="txt"><b>' + title + '</b><span>' + sub + '</span></span><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '></label>';
    const min = (v) => v + ' min';
    return '<div class="page"><form data-form="policy" class="page" style="gap:22px">' +
      '<div class="page-head"><div><span class="eyebrow">Configuración de la empresa</span><h1>Políticas</h1><p>Lo que definas aquí se aplica a las 48 personas. Cada trabajador ajusta sus pausas dentro de estos límites.</p></div>' +
      '<button class="btn btn-primary" type="submit">Guardar cambios</button></div>' +
      '<div class="grid g2">' +
      '<section class="card"><h3>Pausas activas</h3>' +
      '<div class="grid g2" style="gap:14px">' +
      '<div class="field"><label for="pol-freq">Frecuencia por defecto</label>' + sel('freq', [60, 75, 90, 105, 120], p.freq, (v) => 'Cada ' + v + ' min') + '</div>' +
      '<div class="field"><label for="pol-dur">Duración de cada pausa</label>' + sel('dur', [3, 5, 7, 10], p.dur, min) + '</div>' +
      '<div class="field"><label for="pol-freqMin">El trabajador puede elegir desde</label>' + sel('freqMin', [45, 60, 75, 90], p.freqMin, (v) => 'Cada ' + v + ' min') + '</div>' +
      '<div class="field"><label for="pol-freqMax">Hasta</label>' + sel('freqMax', [90, 105, 120, 150], p.freqMax, (v) => 'Cada ' + v + ' min') + '</div>' +
      '<div class="field"><label for="pol-maxPostpones">Aplazamientos por día</label>' + sel('maxPostpones', [0, 1, 2, 3], p.maxPostpones, (v) => (v ? v + (v === 1 ? ' vez' : ' veces') : 'No permitir')) + '</div>' +
      '<div class="field"><label for="pol-postponeMin">Cada aplazamiento</label>' + sel('postponeMin', [5, 10, 15], p.postponeMin, min) + '</div>' +
      '</div>' +
      '<div>' + sw('allowSkip', 'Permitir saltar pausas', 'El trabajador indica el motivo y queda registrado.', p.allowSkip) + '</div>' +
      '</section>' +
      '<section class="card"><h3>Jornada y desconexión</h3>' +
      '<div class="grid g2" style="gap:14px"><div class="field"><label for="pol-start">Inicio de jornada</label><input id="pol-start" name="start" type="time" class="input" value="' + p.start + '"></div>' +
      '<div class="field"><label for="pol-end">Fin de jornada</label><input id="pol-end" name="end" type="time" class="input" value="' + p.end + '"></div></div>' +
      '<div>' + sw('dnd', 'No molestar durante las pausas', 'Silencia notificaciones en notebook y celular corporativo.', p.dnd) +
      sw('offHours', 'Desconexión fuera de la jornada', 'Pausa las apps de trabajo desde el fin de la jornada hasta el inicio del día siguiente.', p.offHours) + '</div>' +
      '</section></div>' +
      '<section class="card"><div class="card-head"><div><h3>Apps que se pausan</h3><p>Se bloquean durante las pausas y fuera de la jornada. Toca para activar o desactivar.</p></div></div>' +
      '<div class="app-tiles">' + D2.APPS.map((a) => '<label class="app-tile' + (p.apps[a.id] ? '' : ' off') + '" style="position:relative"><input type="checkbox" name="app_' + a.id + '"' + (p.apps[a.id] ? ' checked' : '') + ' data-change="app-tile">' + D2.appTile(a) + a.name + '</label>').join('') + '</div></section>' +
      '<section class="card"><div class="card-head"><div><h3>Dispositivos e integraciones</h3><p>96 dispositivos vinculados: 48 notebooks y 48 celulares corporativos.</p></div></div>' +
      '<div class="grid g3" style="gap:10px">' +
      [['Microsoft Intune', 'Bloqueo de apps en notebooks'], ['Google Workspace', 'Modo No molestar en Gmail y Chat'], ['Slack', 'Estado "En pausa" automático']].map((i) => '<div class="device">' + D2.icon('laptop') + '<div class="grow"><b>' + i[0] + '</b><span>' + i[1] + '</span></div><span class="pill pill-ok">Conectado</span></div>').join('') +
      '</div></section>' +
      '<div class="row"><button class="btn btn-primary" type="submit">Guardar cambios</button><button class="btn btn-ghost" type="button" data-act="reset">Reiniciar demo</button></div>' +
      '</form></div>';
  };
  D2.changes['app-tile'] = function (el) { el.closest('.app-tile').classList.toggle('off', !el.checked); };
  D2.forms.policy = function (form) {
    const fd = new FormData(form);
    const p = D2.state.policy;
    const freqMin = Number(fd.get('freqMin')), freqMax = Number(fd.get('freqMax'));
    if (freqMin > freqMax) { D2.toast('El mínimo de frecuencia no puede ser mayor que el máximo', 'alert'); return; }
    if (String(fd.get('start')) >= String(fd.get('end'))) { D2.toast('El fin de jornada debe ser después del inicio', 'alert'); return; }
    Object.assign(p, {
      freq: Math.max(freqMin, Math.min(freqMax, Number(fd.get('freq')))), dur: Number(fd.get('dur')), freqMin, freqMax,
      maxPostpones: Number(fd.get('maxPostpones')), postponeMin: Number(fd.get('postponeMin')),
      allowSkip: !!fd.get('allowSkip'), dnd: !!fd.get('dnd'), offHours: !!fd.get('offHours'),
      start: String(fd.get('start')), end: String(fd.get('end')),
    });
    D2.APPS.forEach((a) => { p.apps[a.id] = !!fd.get('app_' + a.id); });
    D2.save();
    D2.render();
    D2.toast('Política guardada. Ya se aplica a las 48 personas.');
  };
})();
</script>
<script>
/* Desconecta2 · vista Jefatura (Operaciones). */
(function () {
  const D2 = window.D2;
  const V = D2.views.jefe;
  const esc = D2.esc;
  const TEAM = 'ops';

  const team = () => D2.areaData().find((a) => a.id === TEAM);
  const legend2 = '<div class="legend"><span><i style="background:var(--series-1)"></i>Tu equipo</span><span><i style="background:var(--series-2)"></i>Empresa</span><span><i class="dash"></i>Meta 3,5</span></div>';

  V.equipo = function () {
    const t = team();
    const comp = D2.companyScores();
    const weakest = D2.DIMS.slice().sort((a, b) => t.scores[a.key] - t.scores[b.key]).slice(0, 2);
    const acts = D2.state.actions;
    const pauseTeam = D2.pauseByArea().find((a) => a.id === TEAM);
    const comments = D2.COMMENTS.filter((c) => c.area === TEAM);
    const own = D2.state.worker.survey;
    if (own && own.open) comments.unshift({ area: TEAM, dim: null, text: own.open, isNew: true });
    const diff = t.index - comp.index;
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Operaciones · 12 personas</span><h1>Mi equipo</h1><p>Ves promedios de tu equipo. No ves respuestas individuales ni denuncias.</p></div></div>' +
      '<div class="grid g4">' +
      D2.kpi('Clima del equipo', D2.f2(t.index) + '<small> /5</small>', (diff >= 0 ? '+' : '−') + D2.f2(Math.abs(diff)), diff >= 0, 'vs empresa') +
      D2.kpi('Respondieron', t.resp + '<small> de ' + t.size + '</small>', null, null, 'Encuesta de septiembre') +
      D2.kpi('Pausas completadas', Math.round(pauseTeam.pct) + '<small>%</small>', '+3 pts', true, 'vs semana anterior') +
      D2.kpi('Plan de acción', acts.filter((a) => a.done).length + '<small> de ' + acts.length + '</small>', null, null, 'acciones hechas') +
      '</div>' +
      '<div class="grid g2">' +
      '<section class="card"><div class="card-head"><div><h3>Tu equipo vs la empresa</h3><p>Septiembre 2026, escala 1 a 5</p></div>' + legend2 + '</div>' +
      D2.hbars(D2.DIMS.map((d) => ({ label: d.label, v: t.scores[d.key], v2: comp.scores[d.key] })), { target: D2.TARGET, s1: 'Tu equipo', s2: 'Empresa' }) + '</section>' +
      '<div class="stack">' +
      '<section class="card"><div class="card-head"><div><h3>Evolución del clima del equipo</h3><p>Índice de Operaciones, abril a septiembre</p></div></div>' +
      D2.chartSlot({ labels: D2.MONTHS, values: t.trend.concat([t.index]), min: 2.8, max: 3.8, ticks: [3, 3.5], fmt: (v) => D2.f1(v), endFmt: (v) => D2.f2(v), goal: 3.5, goalLabel: 'Meta 3,5', aria: 'Evolución del clima del equipo', height: 190 }) + '</section>' +
      '<div class="notice">' + D2.icon('shield') + '<span><b>Las denuncias no pasan por ti</b>El canal anónimo llega directo a RR.HH. Así quien denuncia está protegido, incluso si la situación involucra a una jefatura.</span></div>' +
      '</div></div>' +
      '<section class="card"><div class="card-head"><div><h3>Dónde enfocarte este mes</h3><p>Las dos dimensiones más bajas de tu equipo y acciones sugeridas</p></div><button class="btn btn-quiet btn-sm" data-act="go" data-view="plan">Ver plan de acción</button></div>' +
      '<div class="grid g2">' + weakest.map((d) => '<div class="card flat"><div class="row between"><h4>' + d.label + '</h4><span class="pill pill-warn nodot num">' + D2.f1(t.scores[d.key]) + ' / 5</span></div>' +
        '<p class="small muted">"' + esc(d.q) + '"</p><div class="list">' + D2.SUGGESTIONS[d.key].map((s) => {
          const added = D2.state.actions.some((a) => a.text === s);
          return '<div class="list-item small"><span class="grow">' + esc(s) + '</span>' + (added ? '<span class="pill pill-ok">En el plan</span>' : '<button class="btn btn-ghost btn-sm" data-act="add-sugg" data-dim="' + d.key + '" data-text="' + esc(s) + '">Agregar</button>') + '</div>';
        }).join('') + '</div></div>').join('') + '</div></section>' +
      '<section class="card"><div class="card-head"><div><h3>Lo que dice tu equipo</h3><p>Comentarios anónimos de septiembre</p></div></div>' +
      '<div class="grid g2" style="gap:10px">' + comments.map((c) => '<div class="comment"><q>' + esc(c.text) + '</q><span class="meta">' + (c.dim ? D2.dimLabel(c.dim) : 'Sin clasificar') + (c.isNew ? ' · <b style="color:var(--brand)">Nuevo</b>' : '') + '</span></div>').join('') + '</div></section>' +
      '</div>';
  };

  V.pausas = function () {
    const ppl = D2.PEOPLE.filter((p) => p.area === TEAM);
    const done = ppl.reduce((n, p) => n + p.completed, 0), sch = ppl.reduce((n, p) => n + p.scheduled, 0);
    const skip = ppl.reduce((n, p) => n + p.skipped, 0);
    const slots = D2.slots().map((s) => s.label);
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Operaciones · semana del 28 sep</span><h1>Pausas del equipo</h1><p>Tu equipo descansa mejor si tú también haces tus pausas y no agendas reuniones encima.</p></div></div>' +
      '<div class="grid g3">' +
      D2.kpi('Cumplimiento', Math.round((done / sch) * 100) + '<small>%</small>', '+3 pts', true, 'Meta 80%') +
      D2.kpi('Pausas saltadas', skip, null, null, 'Motivo principal: reuniones') +
      D2.kpi('Personas bajo 60%', ppl.filter((p) => p.completed / p.scheduled < 0.6).length, null, null, 'de ' + ppl.length + ' en tu equipo') +
      '</div>' +
      '<div class="grid g-main">' +
      '<section class="card"><div class="card-head"><div><h3>Cumplimiento semanal</h3><p>Operaciones, % de pausas completadas</p></div></div>' +
      D2.chartSlot({ labels: D2.WEEKS, values: D2.WEEKLY_OPS, min: 40, max: 100, ticks: [40, 60, 80, 100], fmt: (v) => v + '%', goal: 80, goalLabel: 'Meta 80%', tipPrefix: 'Semana del ', aria: 'Cumplimiento semanal del equipo' }) + '</section>' +
      '<section class="card flat"><h4>Evita agendar reuniones a estas horas</h4><div class="row">' + slots.map((s) => '<span class="pill pill-brand nodot num">' + D2.icon('clock').replace('<svg', '<svg width="14" height="14"') + s + '</span>').join('') + '</div>' +
      '<p class="small ink2">El 44% de las pausas saltadas en tu equipo coincide con reuniones.</p></section>' +
      '</div>' +
      '<section class="card"><div class="card-head"><div><h3>Por persona</h3><p>Ordenado de menor a mayor cumplimiento</p></div></div><div class="table-wrap">' +
      '<table><thead><tr><th>Persona</th><th class="hide-mobile">Cargo</th><th style="min-width:160px">Cumplimiento</th><th class="r">Pospuestas</th><th class="r">Saltadas</th></tr></thead><tbody>' +
      ppl.slice().sort((a, b) => a.completed / a.scheduled - b.completed / b.scheduled).map((p) => '<tr><td style="white-space:nowrap"><span class="row nowrap" style="gap:8px"><span class="avatar" style="width:28px;height:28px;font-size:11px">' + D2.initials(p.name) + '</span>' + esc(p.name) + '</span></td><td class="hide-mobile muted">' + p.cargo + '</td><td>' + D2.minibar(p.completed, p.scheduled) + '</td><td class="r num">' + p.postponed + '</td><td class="r num">' + p.skipped + '</td></tr>').join('') +
      '</tbody></table></div></section>' +
      '</div>';
  };

  V.plan = function () {
    const acts = D2.state.actions;
    const t = team();
    const dimOpts = D2.DIMS.map((d) => '<option value="' + d.key + '">' + d.label + '</option>').join('');
    return '<div class="page">' +
      '<div class="page-head"><div><span class="eyebrow">Operaciones · octubre 2026</span><h1>Plan de acción</h1><p>Acciones concretas para mejorar lo que tu equipo marcó más bajo. RR.HH. ve el avance.</p></div></div>' +
      '<div class="grid g-main">' +
      '<section class="card"><div class="card-head"><div><h3>Acciones del mes</h3><p>' + acts.filter((a) => a.done).length + ' de ' + acts.length + ' hechas</p></div></div>' +
      '<div class="list">' + acts.map((a) => '<label class="check-item' + (a.done ? ' done' : '') + '"><input type="checkbox" data-change="action-done" data-id="' + a.id + '"' + (a.done ? ' checked' : '') + '><span class="grow"><b class="small">' + esc(a.text) + '</b><span class="xs muted">' + D2.dimLabel(a.dim) + ' · equipo en ' + D2.f1(t.scores[a.dim]) + '</span></span></label>').join('') + '</div>' +
      '<form data-form="add-action" class="stack" style="padding-top:6px"><div class="divider"></div><h4>Agregar acción</h4>' +
      '<div class="grid g2" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px"><div class="field"><label class="visually-hidden" for="act-text">Acción</label><input id="act-text" name="text" class="input" placeholder="Ej: reunión de 15 minutos los lunes con agenda"></div>' +
      '<div class="field"><label class="visually-hidden" for="act-dim">Dimensión</label><select id="act-dim" name="dim" class="select">' + dimOpts + '</select></div></div>' +
      '<div><button class="btn btn-primary btn-sm" type="submit">Agregar al plan</button></div></form>' +
      '</section>' +
      '<aside class="stack"><section class="card flat"><h4>Cómo armar un buen plan</h4><div class="list small">' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('check') + '</span><span class="grow">Máximo 3 a 5 acciones por mes.</span></div>' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('check') + '</span><span class="grow">Que dependan de ti, no de otra área.</span></div>' +
      '<div class="list-item"><span class="icon-dot brand">' + D2.icon('check') + '</span><span class="grow">Cuéntale al equipo qué vas a cambiar. La próxima encuesta mide si funcionó.</span></div>' +
      '</div></section></aside></div></div>';
  };

  Object.assign(D2.actions, {
    'add-sugg'(el) {
      D2.state.actions.push({ id: 'a' + Date.now(), dim: el.dataset.dim, text: el.dataset.text, done: false });
      D2.save();
      D2.render();
      D2.toast('Acción agregada al plan');
    },
  });
  D2.changes['action-done'] = function (el) {
    const a = D2.state.actions.find((x) => x.id === el.dataset.id);
    a.done = el.checked;
    D2.save();
    D2.render();
  };
  D2.forms['add-action'] = function (form) {
    const fd = new FormData(form);
    const text = String(fd.get('text') || '').trim();
    if (!text) { document.getElementById('act-text').focus(); return; }
    D2.state.actions.push({ id: 'a' + Date.now(), dim: String(fd.get('dim')), text, done: false });
    D2.save();
    D2.render();
    D2.toast('Acción agregada al plan');
  };
})();
</script>
