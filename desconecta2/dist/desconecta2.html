<title>Desconecta2</title>
<meta name="description" content="Prototipo de Desconecta2: clima laboral, canal de denuncias anónimo y pausas activas.">

<style>
/* Desconecta2 · prototipo
   Layout: app shell — barra superior con selector de vista, menú lateral en escritorio,
   barra de pestañas inferior en celular. Pausa activa = pantalla completa verde bosque. */
:root {
  --bg: #F1F4F0;
  --surface: #FFFFFF;
  --surface-2: #E7ECE6;
  --surface-3: #DCE4DB;
  --ink: #15211A;
  --ink-2: #44554A;
  --muted: #6E7D73;
  --line: #D3DCD2;
  --brand: #22603F;
  --brand-hover: #1A4E33;
  --brand-ink: #FFFFFF;
  --brand-soft: #D9EADF;
  --accent: #D98A1E;
  --accent-soft: #FBEBD2;
  --accent-ink: #5A3605;
  --ok: #1E7A4C;
  --ok-soft: #DDF0E4;
  --warn: #A86A00;
  --warn-soft: #FAEBC8;
  --crit: #B83A24;
  --crit-soft: #F8DFD8;
  --info: #3B62A3;
  --info-soft: #DFE7F5;
  --series-1: #2A8156;
  --series-2: #5571B0;
  --div-low: #C9502F;
  --div-high: #2A8156;
  --pause-bg: #0D2A1D;
  --pause-bg-2: #143826;
  --pause-fg: #EAF3EC;
  --pause-muted: #9DBBA8;
  --pause-glow: #7FD3A3;
  --shadow: 0 1px 2px rgba(21, 33, 26, .06), 0 6px 20px rgba(21, 33, 26, .06);

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-xs: .75rem;
  --fs-sm: .8125rem;
  --fs-md: .9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2rem;
  --fs-3xl: 2.75rem;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --sidebar: 248px;
  --topbar: 60px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1511;
    --surface: #16201A;
    --surface-2: #1D2A22;
    --surface-3: #25352B;
    --ink: #E5EEE7;
    --ink-2: #B2C2B7;
    --muted: #84958A;
    --line: #2A3A30;
    --brand: #5CB98A;
    --brand-hover: #74C99D;
    --brand-ink: #0A1A11;
    --brand-soft: #1C3829;
    --accent: #F0AE4E;
    --accent-soft: #3A2A12;
    --accent-ink: #FBE3BC;
    --ok: #5CC28E;
    --ok-soft: #173525;
    --warn: #E8B44A;
    --warn-soft: #3A2C10;
    --crit: #F08068;
    --crit-soft: #3D1D16;
    --info: #85A6E0;
    --info-soft: #1C2840;
    --series-1: #3E9E6C;
    --series-2: #7088CC;
    --div-low: #E2734F;
    --div-high: #3E9E6C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1511;
  --surface: #16201A;
  --surface-2: #1D2A22;
  --surface-3: #25352B;
  --ink: #E5EEE7;
  --ink-2: #B2C2B7;
  --muted: #84958A;
  --line: #2A3A30;
  --brand: #5CB98A;
  --brand-hover: #74C99D;
  --brand-ink: #0A1A11;
  --brand-soft: #1C3829;
  --accent: #F0AE4E;
  --accent-soft: #3A2A12;
  --accent-ink: #FBE3BC;
  --ok: #5CC28E;
  --ok-soft: #173525;
  --warn: #E8B44A;
  --warn-soft: #3A2C10;
  --crit: #F08068;
  --crit-soft: #3D1D16;
  --info: #85A6E0;
  --info-soft: #1C2840;
  --series-1: #3E9E6C;
  --series-2: #7088CC;
  --div-low: #E2734F;
  --div-high: #3E9E6C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: var(--fs-2xl); font-weight: 800; }
h2 { font-size: var(--fs-xl); font-weight: 700; }
h3 { font-size: var(--fs-lg); font-weight: 700; }
h4 { font-size: var(--fs-md); font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); grid-template-rows: var(--topbar) minmax(0, 1fr); }
.topbar {
  grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 16px; padding-inline: 20px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex: none; }
.logo-mark span { display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--brand-ink); box-shadow: 8px 0 0 var(--brand-ink); transform: translateX(-4px); }
.logo b { color: var(--brand); font-weight: 800; }
.demo-chip { font-size: var(--fs-xs); font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.topbar-spacer { flex: 1; }
.role-switch { display: flex; align-items: center; gap: 10px; }
.role-switch-label { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.segmented { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 99px; gap: 2px; }
.segmented button { border: 0; background: transparent; padding: 6px 14px; border-radius: 99px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); background: var(--brand-soft); color: var(--brand); flex: none; }
.user-chip .who { line-height: 1.2; }
.user-chip .who b { display: block; font-size: var(--fs-sm); }
.user-chip .who span { font-size: var(--fs-xs); color: var(--muted); }

.sidebar { position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--topbar)); padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.sidebar .eyebrow { padding: 0 12px 8px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); border: 0; background: transparent; text-align: left; font-weight: 600; color: var(--ink-2); width: 100%; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.nav-badge { margin-left: auto; font-size: var(--fs-xs); background: var(--crit); color: #fff; border-radius: 99px; padding: 0 7px; line-height: 18px; font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 14px 12px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); color: var(--ink-2); display: grid; gap: 6px; }
.sidebar-foot b { color: var(--ink); }

.main { min-width: 0; padding: 28px 32px 48px; }
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head > div { display: grid; gap: 6px; min-width: 0; }
.page-head p { color: var(--ink-2); max-width: 62ch; }

.tabbar { display: none; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-head > div { display: grid; gap: 3px; min-width: 0; }
.card-head p { color: var(--muted); font-size: var(--fs-sm); }
.card.flat { background: var(--surface-2); border-color: transparent; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.divider { height: 1px; background: var(--line); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 99px; padding: 10px 18px; font-weight: 700; font-size: var(--fs-sm); text-decoration: none; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-accent { background: var(--accent); color: #241400; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-quiet { background: var(--surface-2); color: var(--ink); }
.btn-quiet:hover { background: var(--surface-3); }
.btn-danger { background: transparent; border-color: var(--crit); color: var(--crit); }
.btn-sm { padding: 6px 12px; font-size: var(--fs-xs); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.nodot::before { display: none; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-crit { background: var(--crit-soft); color: var(--crit); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-neutral { background: var(--surface-2); color: var(--ink-2); }
.pill-brand { background: var(--brand-soft); color: var(--brand); }

.kpi { display: grid; gap: 6px; }
.kpi-value { font-family: var(--f-display); font-size: var(--fs-3xl); font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: var(--fs-lg); color: var(--muted); font-weight: 600; letter-spacing: 0; }
.delta { font-size: var(--fs-sm); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--crit); }

.notice { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); font-size: var(--fs-sm); align-items: flex-start; }
.notice svg { width: 20px; height: 20px; flex: none; color: var(--brand); margin-top: 1px; }
.notice.warn { background: var(--warn-soft); }
.notice.warn svg { color: var(--warn); }
.notice.info { background: var(--info-soft); }
.notice.info svg { color: var(--info); }
.notice b { display: block; margin-bottom: 2px; }

.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.list-item:first-child { border-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .grow b { display: block; }
.icon-dot { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); }
.icon-dot svg { width: 18px; height: 18px; }
.icon-dot.crit { background: var(--crit-soft); color: var(--crit); }
.icon-dot.warn { background: var(--warn-soft); color: var(--warn); }
.icon-dot.ok { background: var(--ok-soft); color: var(--ok); }
.icon-dot.info { background: var(--info-soft); color: var(--info); }
.icon-dot.brand { background: var(--brand-soft); color: var(--brand); }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-weight: 700; font-size: var(--fs-sm); }
.field .hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; font-size: var(--fs-md); }
.textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.choice { position: relative; display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; background: var(--surface); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { font-size: var(--fs-sm); }
.choice span { font-size: var(--fs-xs); color: var(--muted); }
.choice:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.choice:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-radio { position: relative; }
.chip-radio input { position: absolute; opacity: 0; pointer-events: none; }
.chip-radio span { display: inline-block; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; background: var(--surface); }
.chip-radio input:checked + span { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip-radio input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.switch:first-child { border-top: 0; }
.switch .txt { display: grid; gap: 2px; min-width: 0; }
.switch .txt b { font-size: var(--fs-sm); }
.switch .txt span { font-size: var(--fs-xs); color: var(--muted); }
.switch input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(18px); }

.range-row { display: grid; gap: 6px; }
.range-row .row { justify-content: space-between; }
input[type="range"] { width: 100%; accent-color: var(--brand); }

/* Likert */
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.likert label { position: relative; }
.likert input { position: absolute; opacity: 0; pointer-events: none; }
.likert span { display: grid; place-items: center; gap: 2px; padding: 10px 4px; border: 1px solid var(--line); border-radius: var(--r-sm); font-weight: 800; font-family: var(--f-display); font-size: var(--fs-lg); cursor: pointer; background: var(--surface); text-align: center; }
.likert span small { font-family: var(--f-body); font-weight: 600; font-size: 10px; color: var(--muted); line-height: 1.2; }
.likert input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.likert input:checked + span small { color: var(--brand-ink); }
.likert input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.q { display: grid; gap: 10px; padding: 18px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q-title { display: flex; gap: 10px; align-items: baseline; }
.q-title .qn { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--muted); flex: none; }
.q-title b { font-size: var(--fs-md); }
.q-dim { font-size: var(--fs-xs); color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th { text-align: left; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

/* Mini bar */
.minibar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.minibar .track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.minibar .fill { height: 100%; border-radius: 99px; background: var(--series-1); }
.minibar .fill.low { background: var(--warn); }
.minibar .fill.crit { background: var(--crit); }

/* Horizontal bars */
.hbars { display: grid; gap: 14px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 44px; gap: 12px; align-items: center; }
.hbar .lbl { font-size: var(--fs-sm); font-weight: 600; min-width: 0; }
.hbar .lbl small { display: block; color: var(--muted); font-weight: 500; font-size: var(--fs-xs); }
.hbar .bars { display: grid; gap: 3px; position: relative; }
.hbar .bar { height: 12px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 4px; }
.hbar .bar.s2 { background: var(--series-2); height: 8px; }
.hbar .bars .target { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--muted); }
.hbar .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.hbar[data-tip] { cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--fs-xs); color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.legend i.dash { border-left: 1.5px dashed var(--muted); border-radius: 0; width: 2px; }

/* Heatmap */
.heat td.cell { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; border-bottom: 2px solid var(--surface); border-right: 2px solid var(--surface); border-radius: 6px; min-width: 48px; padding-inline: 6px; }
.heat td.hidden-cell { text-align: left; color: var(--muted); font-size: var(--fs-xs); font-weight: 500; background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); }
.heat th { white-space: normal; vertical-align: bottom; padding-inline: 6px; letter-spacing: .03em; }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--ink-2); flex-wrap: wrap; }

  D2.hhmm = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  D2.stamp = () => { const d = new Date(D2.now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + D2.hhmm(d.getTime()); };
  D2.mmss = (sec) => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  D2.initials = (name) => name.split(' ').map((w) => w[0]).slice(0, 2).join('');
  D2.avg = (arr) => arr.reduce((a, b) => a + b, 0) / (arr.length || 1);

  // Escala divergente para el mapa de calor (meta 3,5 = neutro)
  D2.heatBg = function (v) {
    const t = Math.max(-1, Math.min(1, (v - D2.TARGET) / 1.2));
    const pctv = Math.round(Math.abs(t) * 62);
    const pole = t < 0 ? 'var(--div-low)' : 'var(--div-high)';
    return 'background: color-mix(in oklab, ' + pole + ' ' + pctv + '%, var(--surface-2))';
  };

  /* ---------- Gráficos (SVG dibujado al ancho real del contenedor) ---------- */
  const charts = {};
  let chartId = 0;
  D2.chartSlot = function (spec) {
    const id = 'c' + ++chartId;
    charts[id] = spec;
    return '<div class="chart" data-chart="' + id + '" style="height:' + (spec.height || 220) + 'px" role="img" aria-label="' + D2.esc(spec.aria || '') + '"></div>';
  };
  D2.drawCharts = function () {
    document.querySelectorAll('[data-chart]').forEach((el) => {
      const spec = charts[el.dataset.chart];
      if (spec) el.innerHTML = lineChart(spec, el.clientWidth || 600);
    });
  };
  D2.resetCharts = function () { for (const k in charts) delete charts[k]; };

  function lineChart(s, W) {
    const H = s.height || 220;
    const padL = 36, padR = 58, padT = 14, padB = 28;
    const iw = Math.max(80, W - padL - padR), ih = H - padT - padB;
    const n = s.values.length;
    const x = (i) => padL + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
    const y = (v) => padT + ih - ((v - s.min) / (s.max - s.min)) * ih;
    const fmt = s.fmt || ((v) => v);
    let out = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    s.ticks.forEach((t) => {
      out += '<line class="grid-line" x1="' + padL + '" x2="' + (padL + iw) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      out += '<text class="axis-label" x="' + (padL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + fmt(t) + '</text>';
    });
    if (s.goal != null) {
      out += '<line class="goal" x1="' + padL + '" x2="' + (padL + iw) + '" y1="' + y(s.goal) + '" y2="' + y(s.goal) + '"/>';
      out += '<text class="goal-label" x="' + (padL + iw + 6) + '" y="' + (y(s.goal) + 4) + '">' + D2.esc(s.goalLabel || 'Meta') + '</text>';
    }
    const step = iw / Math.max(1, n - 1) < 46 ? 2 : 1;
    s.labels.forEach((l, i) => {
      if (i % step && i !== n - 1) return;
      out += '<text class="axis-label" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + D2.esc(l) + '</text>';
    });
    const pts = s.values.map((v, i) => x(i) + ',' + y(v));
    out += '<path class="area" d="M' + x(0) + ',' + (padT + ih) + ' L' + pts.join(' L') + ' L' + x(n - 1) + ',' + (padT + ih) + ' Z"/>';
    out += '<polyline class="line" points="' + pts.join(' ') + '"/>';
    out += '<line class="cross" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + ih) + '"/>';
    const last = s.values[n - 1];
    out += '<circle class="dot" cx="' + x(n - 1) + '" cy="' + y(last) + '" r="5"/>';
    // Evita que la etiqueta final choque con la de la meta
    let ly = y(last) + 4;
    if (s.goal != null && Math.abs(y(last) - y(s.goal)) < 14) ly = y(last) + (y(last) < y(s.goal) ? -6 : 16);
    out += '<text class="end-label" x="' + (x(n - 1) + 10) + '" y="' + ly + '">' + (s.endFmt || fmt)(last) + '</text>';
    const colW = iw / Math.max(1, n - 1);
    s.values.forEach((v, i) => {
      const tip = '<b>' + D2.esc((s.endFmt || fmt)(v)) + '</b>' + D2.esc((s.tipPrefix || '') + s.labels[i]);
      out += '<rect class="hit" x="' + (x(i) - colW / 2) + '" y="' + padT + '" width="' + colW + '" height="' + ih + '" data-cx="' + x(i) + '" data-tip="' + D2.esc(tip) + '"/>';
    });
    out += '</svg>';
    return out;
  }

  /* ---------- Tooltip global ---------- */
  function placeTip(e) {
    const tip = document.getElementById('tip');
    const pad = 14;
    let left = e.clientX + pad, top = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if (left + r.width > window.innerWidth - 8) left = e.clientX - r.width - pad;
    if (top + r.height > window.innerHeight - 8) top = e.clientY - r.height - pad;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = Math.max(8, top) + 'px';
  }
  function showTip(e) {
    const t = e.target.closest && e.target.closest('[data-tip]');
    const tip = document.getElementById('tip');
    if (!tip) return;
    document.querySelectorAll('.cross').forEach((c) => (c.style.opacity = 0));
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute('data-tip');
    tip.hidden = false;
    placeTip(e);
    if (t.dataset.cx) {
      const cross = t.ownerSVGElement && t.ownerSVGElement.querySelector('.cross');
      if (cross) { cross.setAttribute('x1', t.dataset.cx); cross.setAttribute('x2', t.dataset.cx); cross.style.opacity = 1; }
    }
  }
  document.addEventListener('pointerover', showTip);
  document.addEventListener('pointermove', (e) => { const tip = document.getElementById('tip'); if (tip && !tip.hidden) placeTip(e); });
  document.addEventListener('pointerout', (e) => { if (!e.relatedTarget || !(e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'))) { const tip = document.getElementById('tip'); if (tip) tip.hidden = true; document.querySelectorAll('.cross').forEach((c) => (c.style.opacity = 0)); } });

  /* ---------- Avisos ---------- */
  D2.toast = function (msg, icon) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = D2.icon(icon || 'check') + '<span>' + D2.esc(msg) + '</span>';
    root.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  };

  /* ---------- Piezas comunes ---------- */
  D2.statusPill = function (status) {
    const cls = ['pill-crit', 'pill-warn', 'pill-info', 'pill-ok'][status];
    return '<span class="pill ' + cls + '">' + D2.STATUSES[status] + '</span>';
  };
  D2.catName = (id) => (D2.CATEGORIES.find((c) => c.id === id) || {}).name || 'Otra situación';
  D2.appTile = function (app) {
    return '<span class="ai" style="background:' + app.color + '">' + app.abbr + '</span>';
  };
  D2.minibar = function (value, max) {
    const p = Math.round((value / max) * 100);
    const cls = p < 60 ? 'crit' : p < 75 ? 'low' : '';
    return '<div class="minibar"><div class="track"><div class="fill ' + cls + '" style="width:' + p + '%"></div></div><span class="num small" style="width:38px;text-align:right">' + p + '%</span></div>';
  };
})();
</script>
<script>
/* Desconecta2 · núcleo: estado, reloj simulado, navegación y eventos. */
(function () {
  const D2 = (window.D2 = window.D2 || {});
  const STORE_KEY = 'desconecta2-demo-v1';
  const LOAD_REAL = Date.now();
  let clockOffset = 0;

  D2.now = () => D2.SIM_START + (Date.now() - LOAD_REAL) + clockOffset;
  D2.advanceClockTo = (ms) => { clockOffset += ms - D2.now(); };

  function freshState() {
    return {
      role: 'worker',
      view: { worker: 'inicio', rrhh: 'resumen', jefe: 'equipo' },
      worker: {
        name: 'Camila Rojas', cargo: 'Analista de operaciones', area: 'ops',
        prefs: { freq: 90, routine: 'mixta', remind: 1 },
        slotStatus: { '10:30': 'completada' },
        snooze: {}, postponesUsed: 0, moods: [], skipReasons: [],
        week: [{ d: 'Lun 28', v: 4 }, { d: 'Mar 29', v: 3 }, { d: 'Mié 30', v: 4 }, { d: 'Jue 1', v: 2 }, { d: 'Vie 2', v: 4 }],
        survey: null,
      },
      policy: {
        freq: 90, freqMin: 60, freqMax: 120, dur: 5, start: '09:00', end: '18:00',
        maxPostpones: 2, postponeMin: 10, allowSkip: true, offHours: true, dnd: true,
        apps: { slack: true, teams: true, outlook: true, gmail: false, sap: true, drive: true, whatsapp: true },
      },
      complaints: D2.seedComplaints(),
      actions: D2.seedActions(),
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(freshState(), JSON.parse(raw));
    } catch (e) { /* almacenamiento no disponible: la demo funciona igual en memoria */ }
    return freshState();
  }
  D2.save = function () {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(D2.state)); } catch (e) { /* sin almacenamiento */ }
  };
  D2.state = load();
  D2.ui = { complaintTab: 'nueva', newCode: null, followCode: null, followError: '', rrhhCase: null, rrhhFilter: 'abiertas', peopleQuery: '', peopleArea: 'all', copied: false };

  /* ---------- Horario de pausas ---------- */
  const toMs = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); const d = D2.simToday(); d.setHours(h, m, 0, 0); return d.getTime(); };
  D2.toMs = toMs;
  D2.effectiveFreq = function () {
    const p = D2.state.policy;
    return Math.max(p.freqMin, Math.min(p.freqMax, D2.state.worker.prefs.freq));
  };
  D2.slots = function () {
    const p = D2.state.policy;
    const freq = D2.effectiveFreq();
    const out = [];
    const start = toMs(p.start), end = toMs(p.end), lunchA = toMs('13:00'), lunchB = toMs('14:00');
    for (let t = start + freq * 60000; t < end - 15 * 60000; t += freq * 60000) {
      if (t >= lunchA && t < lunchB) continue;
      const label = D2.hhmm(t);
      out.push({ label, at: t, status: D2.state.worker.slotStatus[label] || null, snooze: D2.state.worker.snooze[label] || null });
    }
    return out;
  };
  D2.nextSlot = function () {
    return D2.slots().find((s) => !s.status) || null;
  };
  D2.slotTarget = (s) => (s.snooze || s.at);

  /* ---------- Navegación ---------- */
  D2.NAV = {
    worker: [
      { id: 'inicio', label: 'Inicio', icon: 'home' },
      { id: 'pausas', label: 'Mis pausas', icon: 'pause' },
      { id: 'encuesta', label: 'Encuesta', icon: 'survey' },
      { id: 'denuncias', label: 'Denuncias', icon: 'shield' },
    ],
    rrhh: [
      { id: 'resumen', label: 'Resumen', icon: 'chart' },
      { id: 'denuncias', label: 'Denuncias', icon: 'inbox', badge: () => D2.state.complaints.filter((c) => c.unread).length },
      { id: 'clima', label: 'Clima laboral', icon: 'survey' },
      { id: 'pausas', label: 'Pausas activas', icon: 'pause' },
      { id: 'politicas', label: 'Políticas', icon: 'sliders' },
    ],
    jefe: [
      { id: 'equipo', label: 'Mi equipo', icon: 'users' },
      { id: 'pausas', label: 'Pausas', icon: 'pause' },
      { id: 'plan', label: 'Plan de acción', icon: 'listcheck' },
    ],
  };
  const PERSONA = {
    worker: { name: 'Camila Rojas', sub: 'Operaciones', note: 'Estás viendo la app como <b>trabajadora</b>. Las denuncias que envíes aquí llegan a RR.HH. sin tu nombre.' },
    rrhh: { name: 'Andrea Fuentes', sub: 'Jefa de Personas', note: 'Estás viendo el panel de <b>RR.HH.</b>. Recibe las denuncias y ve todos los datos de pausas y clima.' },
    jefe: { name: 'Rodrigo Muñoz', sub: 'Jefe de Operaciones', note: 'Estás viendo la vista de <b>jefatura</b>. Ve el clima de su equipo en agregado y no tiene acceso a denuncias.' },
  };

  D2.render = function (opts) {
    const st = D2.state;
    const role = st.role;
    const view = st.view[role];
    const nav = D2.NAV[role];
    const persona = PERSONA[role];
    D2.resetCharts();
    const navBtn = (n, cls) => {
      const b = n.badge ? n.badge() : 0;
      return '<button class="' + cls + '" data-act="nav" data-view="' + n.id + '"' + (n.id === view ? ' aria-current="page"' : '') + '>' + D2.icon(n.icon) + '<span>' + n.label + '</span>' + (b ? '<span class="nav-badge">' + b + '</span>' : '') + '</button>';
    };
    const roles = [['worker', 'Trabajador'], ['rrhh', 'RR.HH.'], ['jefe', 'Jefatura']];
    const page = (D2.views[role][view] || D2.views[role][nav[0].id])();
    document.getElementById('app').innerHTML =
      '<div class="shell">' +
      '<header class="topbar">' +
      '<a class="logo" href="#" data-act="nav" data-view="' + nav[0].id + '" aria-label="Desconecta2, inicio"><span class="logo-mark"><span></span></span><span class="logo-text">Desconecta<b>2</b></span></a>' +
      '<span class="demo-chip">Prototipo · datos de ejemplo</span>' +
      '<span class="topbar-spacer"></span>' +
      '<div class="role-switch"><span class="role-switch-label">Ver como</span><div class="segmented" role="group" aria-label="Cambiar vista">' +
      roles.map((r) => '<button data-act="role" data-role="' + r[0] + '" aria-pressed="' + (r[0] === role) + '">' + r[1] + '</button>').join('') +
      '</div></div>' +
      '<div class="user-chip"><span class="avatar">' + D2.initials(persona.name) + '</span><span class="who"><b>' + persona.name + '</b><span>' + persona.sub + '</span></span></div>' +
      '</header>' +
      '<nav class="sidebar" aria-label="Secciones"><div class="eyebrow">' + D2.company.name + '</div>' +
      nav.map((n) => navBtn(n, 'nav-item')).join('') +
      '<div class="sidebar-foot"><span>' + persona.note + '</span><button class="link small" data-act="reset">Reiniciar demo</button></div>' +
      '</nav>' +
      '<main class="main" id="main">' + page + '</main>' +
      '<nav class="tabbar" aria-label="Secciones">' + nav.map((n) => navBtn(n, 'tab')).join('') + '</nav>' +
      '</div>';
    D2.drawCharts();
    D2.tickDom();
    if (opts && opts.scroll) window.scrollTo({ top: 0 });
  };

  /* ---------- Acciones ---------- */
  D2.actions = {
    nav(el) { D2.state.view[D2.state.role] = el.dataset.view; D2.ui.rrhhCase = null; D2.save(); D2.render({ scroll: true }); },
    go(el) { D2.state.view[D2.state.role] = el.dataset.view; if (el.dataset.tab) D2.ui.complaintTab = el.dataset.tab; D2.save(); D2.render({ scroll: true }); },
    role(el) { D2.state.role = el.dataset.role; D2.ui.rrhhCase = null; D2.save(); D2.render({ scroll: true }); },
    reset() {
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nada */ }
      D2.state = freshState();
      clockOffset = 0;
      D2.ui = { complaintTab: 'nueva', newCode: null, followCode: null, followError: '', rrhhCase: null, rrhhFilter: 'abiertas', peopleQuery: '', peopleArea: 'all', copied: false };
      D2.closeOverlay();
      D2.render({ scroll: true });
      D2.toast('Demo reiniciada', 'refresh');
    },
  };
  D2.forms = {};
  D2.changes = {};
  D2.views = { worker: {}, rrhh: {}, jefe: {} };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = D2.actions[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = D2.forms[form.dataset.form];
    if (fn) fn(form);
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const fn = D2.changes[el.dataset.change];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const fn = D2.changes[el.dataset.input];
    if (fn) fn(el, e);
  });

  /* ---------- Reloj ---------- */
  D2.tickDom = function () {
    const now = D2.now();
    document.querySelectorAll('[data-clock]').forEach((el) => (el.textContent = D2.hhmm(now)));
    const next = D2.nextSlot();
    document.querySelectorAll('[data-countdown]').forEach((el) => {
      if (!next) { el.textContent = '—'; return; }
      const sec = Math.max(0, Math.round((D2.slotTarget(next) - now) / 1000));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      el.textContent = (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
    });
  };
  setInterval(() => {
    D2.tickDom();
    if (D2.pauseTick) D2.pauseTick();
  }, 250);

  let resizeT;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(D2.drawCharts, 120); });

  document.addEventListener('DOMContentLoaded', () => D2.render());
  if (document.readyState !== 'loading') setTimeout(() => D2.render(), 0);
})();
</script>
<script>
/* Desconecta2 · pausa activa: alarma, rutina con videos animados, cierre y desconexión. */
(function () {
  const D2 = window.D2;
  const SPEEDS = [1, 5, 20];
  D2.pause = null;

  D2.routineSteps = function () {
    const r = D2.state.worker.prefs.routine;
    if (r === 'respiracion') return D2.ROUTINE.filter((s) => s.type === 'breath').map((s) => Object.assign({}, s, { dur: 150 }));
    if (r === 'movilidad') return D2.ROUTINE.filter((s) => s.type === 'move').map((s) => Object.assign({}, s, { dur: 75 }));
    return D2.ROUTINE;
  };
  D2.blockedApps = () => D2.APPS.filter((a) => D2.state.policy.apps[a.id]);

  function figure(anim) {
    let arms = '<path class="body" d="M78 76 L72 108 L74 136"/><path class="body" d="M122 76 L128 108 L126 136"/>';
    let hints = '';
    if (anim === 'circles') {
      arms = '<g class="arm-l"><path class="body" d="M78 76 L42 80"/></g><g class="arm-r"><path class="body" d="M122 76 L158 80"/></g>';
      hints = '<path class="hint" d="M34 58 A26 26 0 0 0 34 102"/><path class="hint" d="M166 58 A26 26 0 0 1 166 102"/>';
    }
    if (anim === 'side') {
      arms = '<path class="body" d="M78 76 L74 46 L88 14"/><path class="body" d="M122 76 L126 46 L112 14"/>';
      hints = '<path class="hint" d="M40 40 Q100 -14 160 40"/>';
    }
    if (anim === 'neck') hints = '<path class="hint" d="M70 26 Q100 4 130 26"/>';
    if (anim === 'shrug') hints = '<path class="hint" d="M62 74 V50 M56 58 L62 50 L68 58 M138 74 V50 M132 58 L138 50 L144 58"/>';
    return '<svg class="figure anim-' + anim + '" viewBox="0 0 200 220" aria-hidden="true">' +
      '<line class="floor" x1="30" y1="208" x2="170" y2="208"/>' + hints +

      '<g class="g-upper"><path class="body" d="M100 72 L100 140"/><path class="body" d="M78 76 L122 76"/>' + arms +
      '<g class="g-head"><path class="body" d="M100 61 L100 72"/><circle class="head" cx="100" cy="45" r="15"/></g></g></svg>';
  }

  function totalLeft(p) {
    const steps = p.steps;
    let left = steps[p.step].dur - p.elapsed;
    for (let i = p.step + 1; i < steps.length; i++) left += steps[i].dur;
    return left;
  }

  function statusChips() {

  D2.renderOverlay = function () {
